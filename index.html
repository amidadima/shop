<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Магазин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Палитра: фиолетово-чёрный «камень», кость, оксблад. Шрифты: фрактура только для имени, Oswald для заголовков, Inter для текста */
:root{
  --bg:#0b090d; --s1:#131017; --s2:#1c1721; --line:rgba(232,224,208,.12); --line2:rgba(232,224,208,.26);
  --tx:#e8e0d0; --mu:#8f8799; --red:#9e1b2d; --red2:#e24b5d; --blood:#4f0b16; --ink:#0b090d; --bone2:#b9b0a0;
  --black:"UnifrakturCook","Old English Text MT",Georgia,serif;
  --disp:Oswald,"Arial Narrow",Impact,sans-serif;
  --sans:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --cross:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e24b5d' stroke-opacity='.4' stroke-width='1' stroke-linecap='round'><path d='M12 2v20M7 8h10'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{overflow-x:hidden}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
/* зерно плёнки и тёмные углы */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.08;background-image:var(--noise);mix-blend-mode:screen}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(ellipse at 50% 38%,transparent 52%,rgba(0,0,0,.55))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.mu{color:var(--mu)} .sm{font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- шапка ---------- */
#hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;
  background:rgba(11,9,13,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
.hl{display:flex;align-items:center;gap:4px}.hr{display:flex;gap:2px}
.brand{cursor:pointer;user-select:none;line-height:1}
.brand span{display:block;font:700 28px/1 var(--black)}
.brand small{display:block;font:500 11px/1 var(--sans);color:var(--red2);margin-top:3px;letter-spacing:.04em}
.drip{position:absolute;left:0;right:0;top:100%;width:100%;height:16px;fill:var(--red);stroke:none;pointer-events:none;filter:drop-shadow(0 2px 6px rgba(158,27,45,.45))}
.ic{position:relative;width:42px;height:42px;display:grid;place-items:center}
.ic svg{width:22px;height:22px}
.ic.act svg{fill:var(--red2);stroke:var(--red2)}
.ic .badge{position:absolute;top:3px;right:1px;min-width:17px;height:17px;padding:0 4px;background:var(--red);color:var(--tx);
  font:600 10px/17px var(--sans);text-align:center;transform:scale(0) rotate(-12deg);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ic .badge.on{transform:scale(1) rotate(-6deg)}
.ic.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.25)}}

#app{padding:0 16px 120px;min-height:80vh}
.view{animation:viewIn .35s ease-out}
.view.na{animation:none}
@keyframes viewIn{from{opacity:0}}

/* ---------- главная ---------- */
.hero{position:relative;margin:14px -16px 0;padding:36px 22px 52px;overflow:hidden;
  background:radial-gradient(120% 70% at 0% 100%,rgba(110,12,28,.6),transparent 62%),linear-gradient(180deg,#15101a,#0c0a0e);
  clip-path:polygon(0 0,100% 0,100% 92%,97% 95%,93% 91.5%,88% 96%,83% 92%,77% 97%,71% 93%,65% 96.5%,59% 92.5%,53% 97%,47% 93%,41% 96%,35% 92%,29% 97%,23% 93.5%,17% 96%,11% 92%,5% 96.5%,0 93%)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(255,255,255,.028) 0 1px,transparent 1px 7px)}
.hero>*{position:relative;z-index:1}
.rose{position:absolute!important;right:-130px;top:-60px;width:440px;height:440px;color:var(--red2);opacity:.2;animation:spin 160s linear infinite;z-index:0!important}
.rose svg{width:100%;height:100%;stroke-width:.8}
.tape{position:absolute!important;top:20px;right:-6px;padding:6px 14px 6px 12px;background:var(--tx);color:var(--ink);font:600 13px/1 var(--disp);transform:rotate(4deg);clip-path:polygon(0 4%,100% 0,97% 50%,100% 100%,2% 96%,4% 50%)}
.hero h1{font:700 clamp(50px,16.5vw,80px)/.9 var(--disp);text-transform:uppercase;margin:34px 0 16px}
.hero h1 em{display:block;font-style:normal;color:transparent;-webkit-text-stroke:1.5px var(--tx);text-shadow:3px 3px 0 var(--red);animation:glitch 8s infinite}
@keyframes glitch{0%,92%,100%{transform:none}93%{transform:translate(-3px,0) skewX(-4deg)}95%{transform:translate(3px,1px)}97%{transform:translate(-1px,-1px) skewX(3deg)}}
.hero p{color:var(--bone2);max-width:270px}
.cdl{font-size:13px;color:var(--mu);margin-top:22px}
.cd{display:flex;gap:8px;margin:8px 0 2px}
.cd div{min-width:56px;padding:9px 6px 8px;text-align:center;border:1px solid var(--line2);border-top:2px solid var(--red);background:rgba(0,0,0,.35)}
.cd b{display:block;font:600 26px/1 var(--disp);font-variant-numeric:tabular-nums;margin-bottom:4px}
.cd span{font-size:11px;line-height:1;color:var(--mu)}
.cta{margin-top:22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;background:var(--red);color:var(--tx);
  font:600 16px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:transform .15s,background .2s}
.cta:active{transform:scale(.97);background:#b82339}
.cta svg{width:18px;height:18px;stroke-width:2}
.cta.wide{width:100%}

.tick{margin:14px -30px 4px;padding:9px 0;overflow:hidden;white-space:nowrap;background:var(--tx);color:var(--ink);transform:rotate(-1.4deg);border-block:2px solid var(--ink);box-shadow:0 0 0 1px var(--line)}
.tick div{display:inline-block;animation:mq 36s linear infinite;font:600 15px/1 var(--disp);text-transform:uppercase;letter-spacing:.14em}
.tick span{margin:0 16px}
.tick span::after{content:"†";margin-left:32px;color:var(--red)}
@keyframes mq{to{transform:translateX(-50%)}}

.rl-b{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;margin-top:22px;padding:16px;border:1px solid var(--line2);
  background:linear-gradient(120deg,rgba(158,27,45,.22),transparent 70%),var(--s1);text-align:left;transition:transform .15s}
.rl-b:active{transform:scale(.985)}
.rl-b b{display:block;font:600 24px/1.05 var(--disp);text-transform:uppercase;letter-spacing:.04em}
.rl-b span{font-size:13px;color:var(--mu);line-height:1.35;display:block;margin-top:4px}
.rl-b i{width:52px;height:52px;flex:none;color:var(--red2)}
.rl-b i svg{width:52px;height:52px;stroke-width:.9;animation:spin 50s linear infinite}

.shead{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 0;scroll-margin-top:70px}
.shead h2{font:700 34px/1 var(--disp);text-transform:uppercase}
.shead span{font:500 15px/1 var(--disp);color:var(--mu);letter-spacing:.06em}
.search{position:relative;margin-top:14px}
.search input{width:100%;padding:13px 16px 13px 44px;border:1px solid var(--line);background:var(--s1);color:var(--tx);font:inherit;font-size:16px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--red2)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border:1px solid var(--line2);color:var(--bone2);font-size:14px;transition:.2s}
.chip.on{background:var(--red);color:var(--tx);border-color:var(--red)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;margin-top:16px}
.card{position:relative;animation:rise .5s both;animation-delay:calc(var(--i,0)*55ms);cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:#150f19 var(--cross) center/38px no-repeat;border:1px solid var(--line)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.55) contrast(1.12) brightness(.9);transition:filter .4s,transform .6s}
.card:active .ph img{filter:none;transform:scale(1.04)}
.ph::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(11,9,13,.18),transparent 38%,rgba(11,9,13,.8))}
.no{position:absolute;left:8px;bottom:7px;z-index:2;font:500 13px/1 var(--disp);letter-spacing:.08em;color:var(--tx);opacity:.85}
.card .nm{margin-top:10px;font:500 15px/1.2 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.pr{font:600 15px/1 var(--disp);letter-spacing:.03em;margin-top:6px}
.pr s{color:var(--mu);font-weight:400;margin-left:8px;text-decoration-color:var(--red2)}
.tag{position:absolute;top:8px;left:-5px;z-index:2;padding:6px 11px 5px;background:var(--red);color:var(--tx);font:600 13px/1 var(--disp);letter-spacing:.06em;
  transform:rotate(-4deg);clip-path:polygon(0 8%,5% 0,100% 5%,98% 100%,3% 95%)}
.heart{position:absolute;top:6px;right:6px;z-index:2;width:34px;height:34px;display:grid;place-items:center;background:rgba(11,9,13,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.heart svg{width:17px;height:17px;stroke:var(--tx);transition:.25s}
.heart.on svg{fill:var(--red2);stroke:var(--red2);animation:pop .4s}
@keyframes pop{50%{transform:scale(1.35)}}

.empty{text-align:center;padding:64px 20px;color:var(--mu)}
.empty svg{width:60px;height:60px;color:var(--red2);stroke-width:1.1;margin:0 auto 16px}
.empty b{display:block;font:600 28px/1.1 var(--disp);text-transform:uppercase;color:var(--tx);margin-bottom:6px}
.sk{aspect-ratio:4/5;background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%);background-size:200% 100%;animation:shim 1.4s infinite}
@keyframes shim{to{background-position:-200% 0}}

/* ---------- товар: фото в готической арке ---------- */
.arch{position:relative;margin-top:14px}
.gwrap{position:relative;overflow:hidden;clip-path:url(#archClip);background:#150f19}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .ph{flex:none;width:100%;border:0;scroll-snap-align:center}
.archline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.archline path{fill:none;vector-effect:non-scaling-stroke}
.archline .a1{stroke:var(--red2);stroke-width:1.5}
.archline .a2{stroke:var(--line2);stroke-width:1}
.arch .heart{top:30%;right:12px}
.arch .tag{top:auto;bottom:16px;left:-6px}
.cnt{position:absolute;right:12px;bottom:14px;z-index:2;padding:5px 10px;background:rgba(11,9,13,.65);font:500 14px/1 var(--disp);letter-spacing:.08em}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;background:var(--mu);opacity:.4;transform:rotate(45deg);transition:.3s}
.dots i.on{background:var(--red2);opacity:1;transform:rotate(45deg) scale(1.3)}
.pname{font:700 38px/1 var(--disp);text-transform:uppercase;margin-top:20px}
.pprice{font:600 24px/1 var(--disp);letter-spacing:.03em;margin-top:12px}
.pprice s{font-weight:400;font-size:17px;color:var(--mu);margin-left:10px;text-decoration-color:var(--red2)}
.pdesc{color:var(--bone2);margin-top:12px;max-width:34em}
.lbl{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px;font:500 14px/1 var(--sans);color:var(--mu)}
.lbl b{color:var(--tx);font-weight:500;margin-left:8px}
.lbl button{color:var(--red2);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:54px;padding:12px 14px;border:1px solid var(--line2);background:var(--s1);font:500 16px/1 var(--disp);letter-spacing:.04em;transition:.2s}
.sz.on{background:var(--tx);color:var(--ink);border-color:var(--tx)}
.sw{width:34px;height:34px;background:var(--c);border:1px solid var(--line2);position:relative;margin:5px}
.sw.on::after{content:"";position:absolute;inset:-5px;border:1.5px solid var(--red2)}
.acc{border-top:1px solid var(--line)}
.acc:last-of-type{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:500;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--red2);font-size:24px;line-height:1;transition:.2s}
.acc[open] summary::after{transform:rotate(45deg)}
.acc p{padding:0 0 16px;color:var(--mu)}
.rowh{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.rowh::-webkit-scrollbar{display:none}
.mini{flex:none;width:132px;cursor:pointer}
.mini .nm{font:500 14px/1.2 var(--disp);letter-spacing:.04em;text-transform:uppercase;margin-top:8px}
.mini .pr{font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- корзина и оформление ---------- */
.h2{font:700 38px/1 var(--disp);text-transform:uppercase;margin:24px 0 16px}
.it{position:relative;display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center;padding:12px;margin-bottom:10px;background:var(--s1);border:1px solid var(--line)}
.it .inf{min-width:0;padding-right:20px}
.it .nm{font:500 15px/1.2 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.it .sub{font-size:13px;color:var(--mu);margin-top:2px}
.it .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.it .row b{font:600 16px/1 var(--disp);letter-spacing:.03em}
.rm{position:absolute;top:6px;right:8px;width:28px;height:28px;font-size:22px;line-height:1;color:var(--mu)}
.qty{display:flex;align-items:center;border:1px solid var(--line2)}
.qty button{width:32px;height:32px;font-size:18px}
.qty span{min-width:26px;text-align:center;font:600 15px/1 var(--disp)}
.ship{padding:14px 16px;margin-bottom:12px;background:var(--s1);border:1px solid var(--line);font-size:14px;color:var(--mu)}
.ship b{color:var(--tx);font-weight:600}
.bar{height:6px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(135deg,var(--red) 0 6px,var(--blood) 6px 12px);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.promo{display:flex;gap:8px;margin:12px 0}
.inp{width:100%;padding:14px 16px;border:1px solid var(--line);background:var(--s1);color:var(--tx);font:inherit;font-size:16px;outline:none;transition:border-color .2s;border-radius:0}
.inp::placeholder{color:var(--mu)}
.inp:focus{border-color:var(--red2)}
.inp.err{border-color:var(--red2);background:rgba(158,27,45,.12)}
textarea.inp{resize:none;display:block}
.btn2{padding:0 18px;border:1px solid var(--red2);color:var(--tx);font:600 15px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pchip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;margin:12px 0;border:1px dashed var(--red2);background:rgba(158,27,45,.12)}
.pchip b{font:600 17px/1.2 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.pchip small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.pchip button{font-size:24px;color:var(--mu);line-height:1}
.sum{padding:16px;background:var(--s1);border:1px solid var(--line2);border-left:3px solid var(--red)}
.ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;color:var(--mu)}
.ln.t{color:var(--tx);font:600 22px/1 var(--disp);letter-spacing:.03em;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.ln .g{color:var(--red2)}
.sec{margin:26px 0 10px;font:600 20px/1 var(--disp);text-transform:uppercase;letter-spacing:.06em}
.field{margin-bottom:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;border:1px solid var(--line);background:var(--s1);transition:.2s}
.opt .rd{width:14px;height:14px;border:1.5px solid var(--mu);flex:none;transform:rotate(45deg);transition:.2s;margin:0 3px}
.opt.on{border-color:var(--red2);background:rgba(158,27,45,.12)}
.opt.on .rd{border-color:var(--red2);background:var(--red2)}
.opt div{flex:1}
.opt small{display:block;color:var(--mu);font-size:13px}
.opt em{font-style:normal;font:600 16px/1 var(--disp);letter-spacing:.03em}
.note{color:var(--mu);font-size:13px;margin-top:12px;text-align:center}
.notg{padding:14px 16px;margin-top:16px;border:1px solid var(--red2);color:var(--red2);font-size:14px}

/* ---------- заказ принят ---------- */
.tkt{position:relative;margin-top:26px;padding:36px 22px 28px;background:linear-gradient(170deg,#1b1520,#0e0b11);border:1px solid var(--line2);text-align:center}
.stamp{display:inline-block;padding:8px 18px 8px 22px;border:3px solid var(--red2);color:var(--red2);font:700 28px/1 var(--disp);letter-spacing:.22em;text-transform:uppercase;
  transform:rotate(-8deg) scale(2.4);opacity:0;animation:stamp .5s .3s cubic-bezier(.2,1.4,.4,1) forwards;filter:url(#rough)}
@keyframes stamp{to{transform:rotate(-8deg) scale(1);opacity:.95}}
.num{font:700 54px/1 var(--disp);margin:24px 0 8px;letter-spacing:.05em}
.perf{border-top:2px dashed var(--line2);margin:24px -22px 20px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line2)}
.perf::before{left:-12px}.perf::after{right:-12px}
.pay{white-space:pre-line;color:var(--bone2)}
.thx{text-align:center;font:700 26px/1.2 var(--black);color:var(--mu);margin:28px 0}

/* ---------- слои ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(5,3,7,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;padding:22px 18px 34px;background:var(--s1);border-top:2px solid var(--red);animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:36px;height:3px;background:var(--line2);margin:-8px auto 16px}
.sh{font:700 32px/1.05 var(--disp);text-transform:uppercase;margin-bottom:10px}
table.sg{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:12px}
.sg th,.sg td{padding:11px 6px;text-align:center;border-bottom:1px solid var(--line)}
.sg th{color:var(--red2);font:500 14px/1.2 var(--sans)}
.code{font:600 24px/1.25 var(--disp);letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:18px;border:1px dashed var(--red2);margin:14px 0;color:var(--tx);background:rgba(158,27,45,.12)}

/* оракул */
.rl{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 45%,rgba(158,27,45,.4),transparent 62%)}
.rl h3{font:600 20px/1 var(--disp);letter-spacing:.3em;text-transform:uppercase;color:var(--red2)}
.tarot{width:min(60vw,230px);aspect-ratio:2/3.3;margin:22px auto 18px;perspective:1000px}
.tin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.2,.4,1)}
.tin.shuf{animation:shuf .45s ease-in-out infinite}
.tin.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border:1px solid var(--line2);overflow:hidden}
.face.back{background:#0e0a11;display:grid;place-items:center;color:var(--red2)}
.face.back::before{content:"";position:absolute;inset:8px;border:1px solid var(--red);opacity:.7}
.face.back svg{width:78%;height:auto;stroke-width:.9;filter:drop-shadow(0 0 8px rgba(226,75,93,.5))}
.face.front{transform:rotateY(180deg);background:linear-gradient(180deg,#1d1622,#0d0a10);padding:10px;display:flex;flex-direction:column;gap:8px;text-align:center}
.face.front .ph{flex:1;aspect-ratio:auto;min-height:0}
.rn{font:600 22px/1 var(--disp);letter-spacing:.3em;text-indent:.3em}
.rc{font-size:13px;color:var(--red2)}
.tn{font:600 17px/1.15 var(--disp);letter-spacing:.05em;text-transform:uppercase}
.tp{font:500 15px/1 var(--disp);color:var(--bone2)}
@keyframes shuf{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-10px) rotate(-3deg)}75%{transform:translateX(10px) rotate(3deg)}}
.rl .mu{min-height:22px}

.fly{position:fixed;width:22px;height:22px;background:var(--red2);transform:rotate(45deg);z-index:80;pointer-events:none;box-shadow:0 0 22px rgba(226,75,93,.8)}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px) rotate(-1deg);max-width:88vw;padding:12px 18px;border-left:4px solid var(--red);background:var(--tx);color:var(--ink);
  font-size:14px;font-weight:500;text-align:center;opacity:0;pointer-events:none;transition:.3s;z-index:90}
#toast.show{opacity:1;transform:translate(-50%,0) rotate(-1deg)}
#fb{position:fixed;left:16px;right:16px;bottom:16px;z-index:30;padding:17px;background:var(--red);color:var(--tx);font:600 17px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;text-align:center;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transform:translateY(150%);transition:transform .3s}
#fb.show{transform:none}

#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;text-align:center;overflow:hidden;transition:opacity .6s,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash .sr{position:absolute;left:50%;top:50%;width:min(130vw,600px);margin:calc(min(130vw,600px)/-2) 0 0 calc(min(130vw,600px)/-2);color:var(--red);opacity:.3;animation:spin 70s linear infinite}
#splash .sr svg{width:100%;height:auto;stroke-width:.7}
#splash .in{position:relative}
#splash .w{display:flex;justify-content:center;font:700 clamp(46px,15vw,72px)/1 var(--black);animation:flick 1.6s .7s}
#splash .w span{opacity:0;transform:translateY(12px);animation:ltr .6s forwards;animation-delay:calc(var(--i)*70ms)}
#splash .tg{margin-top:14px;font-size:14px;color:var(--red2);opacity:0;animation:ltr .6s .9s forwards}
@keyframes ltr{to{opacity:1;transform:none}}
@keyframes flick{0%,19%,21%,60%,62%,100%{opacity:1}20%,61%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- арка собора и грубый край для печати -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="archClip" clipPathUnits="objectBoundingBox"><path style="fill:#000;stroke:none" d="M0 1V0.3C0 0.14 0.3 0.05 0.5 0C0.7 0.05 1 0.14 1 0.3V1Z"/></clipPath>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/></filter>
  </defs>
</svg>

<div id="splash"><div class="sr" id="spr"></div><div class="in"><div class="w" id="spw"></div><div class="tg" id="spt"></div></div></div>

<header id="hd">
  <div class="hl">
    <button class="ic" id="hbk" data-act="back" style="display:none" aria-label="Назад"></button>
    <div class="brand" data-act="logo"><span id="brandName">&nbsp;</span><small id="brandTag"></small></div>
  </div>
  <div class="hr">
    <button class="ic" id="favBtn" data-act="favFilter" aria-label="Избранное"></button>
    <button class="ic" id="bagBtn" data-act="bag" aria-label="Корзина"></button>
  </div>
  <svg class="drip" viewBox="0 0 400 26" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H400V5H382V18a3 3 0 0 1-6 0V5H300V11a2.5 2.5 0 0 1-5 0V5H221V24a3.5 3.5 0 0 1-7 0V5H140V13a2.5 2.5 0 0 1-5 0V5H61V20a3 3 0 0 1-6 0V5H0Z"/></svg>
</header>

<div id="app">
  <div class="grid" style="margin-top:18px"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</div>

<button id="fb" type="button"></button>
<div id="toast"></div>

<script>
(() => {
"use strict";

// ===== НАСТРОЙКА: адрес вашего Cloudflare Worker =====
const API_URL = "https://ВАШ-ВОРКЕР.workers.dev";
// =====================================================

const TG = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(TG && TG.initData);
const PREVIEW = /[?&]preview=1/.test(location.search);   // просмотр дизайна в обычном браузере
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const app = $("#app");
const safe = fn => { try { return fn(); } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ").trim();
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const store = (k, v) => safe(() => localStorage.setItem(k, JSON.stringify(v)));
const hap = {
  sel() { safe(() => TG.HapticFeedback.selectionChanged()); },
  tap() { safe(() => TG.HapticFeedback.impactOccurred("light")); },
  ok() { safe(() => TG.HapticFeedback.notificationOccurred("success")); },
  warn() { safe(() => TG.HapticFeedback.notificationOccurred("warning")); }
};

safe(() => { TG.ready(); TG.expand(); });
safe(() => { TG.setHeaderColor("#0b090d"); TG.setBackgroundColor("#0b090d"); });
safe(() => { TG.setBottomBarColor("#0b090d"); });
safe(() => { TG.disableVerticalSwipes(); });

// ---------- иконки ----------
const svg = d => `<svg viewBox="0 0 24 24">${d}</svg>`;
const I = {
  heart: svg('<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>'),
  bag: svg('<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>'),
  back: svg('<path d="M15 18l-6-6 6-6"/>'),
  arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>')
};
// розетта готического собора (окно-роза), рисуется кодом
function roseSvg() {
  let s = "";
  for (let i = 0; i < 12; i++) {
    const a = i * 30;
    s += `<path d="M100 80C90 64 90 46 100 30C110 46 110 64 100 80Z" transform="rotate(${a} 100 100)"/>`;
    s += `<path d="M100 78V8" transform="rotate(${a + 15} 100 100)"/>`;
    s += `<circle cx="100" cy="17" r="4.5" transform="rotate(${a + 15} 100 100)"/>`;
  }
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="97"/><circle cx="100" cy="100" r="92"/><circle cx="100" cy="100" r="82"/><circle cx="100" cy="100" r="22"/><circle cx="100" cy="100" r="9"/>${s}</svg>`;
}
const titleCase = s => String(s || "").toLowerCase().replace(/(^|\s)\S/g, m => m.toUpperCase());
$("#hbk").innerHTML = I.back;
$("#favBtn").innerHTML = I.heart;
$("#bagBtn").innerHTML = I.bag + '<span class="badge" id="bagN">0</span>';

// ---------- состояние ----------
let CFG = {}, PRODUCTS = [];
const S = {
  cat: "Все", q: "", favOnly: false,
  cart: load("cart", []), fav: load("fav", []), promo: load("promo", ""),
  form: Object.assign({ name: "", phone: "", address: "", comment: "" }, load("form", {})),
  delivery: load("delivery", "")
};
if (!Array.isArray(S.cart)) S.cart = [];
if (!Array.isArray(S.fav)) S.fav = [];
if (!S.form.name) {
  const u = safe(() => TG.initDataUnsafe.user) || {};
  S.form.name = [u.first_name, u.last_name].filter(Boolean).join(" ");
}

// ---------- утилиты ----------
const prod = id => PRODUCTS.find(p => p.id === id);
const cur = () => CFG.currency || "₽";
const money = n => Number(n).toLocaleString("ru-RU") + " " + cur();
const photos = p => (p.imgs && p.imgs.length) ? p.imgs : (p.img ? [p.img] : []);
const keyOf = i => i.id + "|" + i.size + "|" + (i.color || "");
const cartCount = () => S.cart.reduce((s, i) => s + i.qty, 0);
const goodsSum = () => S.cart.reduce((s, i) => s + prod(i.id).price * i.qty, 0);
const phHtml = (p, i = 0, num = false) => {
  const u = photos(p)[i];
  return `<div class="ph">${u ? `<img src="${esc(u)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ""}${num ? `<span class="no">№${String(p.id).padStart(2, "0")}</span>` : ""}</div>`;
};
const plural = n => { const a = n % 10, b = n % 100; return (a === 1 && b !== 11) ? "товар" : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? "товара" : "товаров"; };
const findPromo = code => code ? (CFG.promos || []).find(p => norm(p.code) === norm(code)) : null;
const signed = n => (n > 0 ? "+" : "−") + money(Math.abs(n));

// Расчёт суммы. Та же формула считается на сервере (worker.js)
function calc(deliveryId) {
  const goods = goodsSum();
  const promo = findPromo(S.promo);
  const adj = promo ? Math.round(goods * promo.percent / 100) : 0;
  const sub = goods + adj;
  const dl = (CFG.delivery || []).find(d => d.id === deliveryId) || null;
  const thr = Number(CFG.freeShipFrom) || 0;
  const free = thr > 0 && sub >= thr;
  const ship = dl ? (free ? 0 : dl.price) : 0;
  return { goods, promo, adj, sub, dl, free, ship, total: sub + ship, thr };
}

// ---------- тосты, шторка, анимации ----------
let toastT;
function toast(m, ms = 2400) {
  const t = $("#toast");
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), ms);
}
function shake(el) { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function notify(m) { IN_TG ? safe(() => TG.showAlert(m)) : toast(m, 3600); }

let sheet = null;
function openSheet(html) {
  closeSheet();
  sheet = document.createElement("div");
  sheet.className = "ov";
  sheet.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
  document.body.appendChild(sheet);
}
function closeSheet() { if (sheet) { sheet.remove(); sheet = null; } }

// лепестки и пепел
function confetti() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:150";
  document.body.appendChild(cv);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const ctx = cv.getContext && cv.getContext("2d");
  if (!ctx) { cv.remove(); return; }
  ctx.scale(dpr, dpr);
  const cols = ["#e24b5d", "#9e1b2d", "#e8e0d0", "#4f0b16", "#b9b0a0"];
  const ps = Array.from({ length: 110 }, () => ({
    x: innerWidth / 2, y: innerHeight * 0.38,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4,
    w: 5 + Math.random() * 7, h: 3 + Math.random() * 5,
    r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: cols[Math.random() * cols.length | 0], round: Math.random() < .55
  }));
  const t0 = performance.now();
  (function frame(t) {
    const k = t - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += .3; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - k / 2600);
      ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.ellipse(0, 0, p.w / 2, p.h / 2, 0, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    k < 2600 ? requestAnimationFrame(frame) : cv.remove();
  })(t0);
}

function fly(fromEl) {
  const bag = $("#bagBtn");
  if (!fromEl || !bag) return;
  const a = fromEl.getBoundingClientRect(), b = bag.getBoundingClientRect();
  const d = document.createElement("div");
  d.className = "fly";
  const sx = a.left + a.width / 2, sy = a.top + Math.min(a.height / 2, 160);
  d.style.left = (sx - 11) + "px"; d.style.top = (sy - 11) + "px";
  document.body.appendChild(d);
  const done = () => { d.remove(); bag.classList.remove("bump"); void bag.offsetWidth; bag.classList.add("bump"); };
  if (!d.animate) return done();
  const an = d.animate([
    { transform: "translate(0,0) rotate(45deg) scale(1)", opacity: 1 },
    { transform: `translate(${b.left + b.width / 2 - sx}px,${b.top + b.height / 2 - sy}px) rotate(45deg) scale(.3)`, opacity: .5 }
  ], { duration: 650, easing: "cubic-bezier(.5,-.2,.7,1)" });
  an.onfinish = done;
}

// ---------- главная кнопка Telegram ----------
const fb = $("#fb");
let mainFn = null;
safe(() => TG.MainButton.onClick(() => mainFn && mainFn()));
fb.addEventListener("click", () => mainFn && mainFn());
function setMain(text, fn) {
  mainFn = fn || null;
  if (IN_TG) {
    if (!text) { safe(() => TG.MainButton.hide()); return; }
    safe(() => { TG.MainButton.setParams({ text, color: "#9e1b2d", text_color: "#e8e0d0" }); TG.MainButton.show(); });
  } else {
    fb.textContent = text || "";
    fb.classList.toggle("show", !!text);
  }
}
function progress(on) {
  if (IN_TG) safe(() => on ? TG.MainButton.showProgress() : TG.MainButton.hideProgress());
  else fb.style.opacity = on ? .6 : 1;
}

// ---------- навигация ----------
let view = { name: "home" };
const stack = [];
function go(v, opt = {}) {
  view.scroll = window.scrollY;
  if (opt.reset) stack.length = 0; else stack.push(view);
  view = v;
  render();
  window.scrollTo(0, 0);
}
function back() {
  if (sheet) { closeSheet(); return; }
  view = stack.pop() || { name: "home" };
  render(false);
  window.scrollTo(0, view.scroll || 0);
}
safe(() => TG.BackButton.onClick(back));

function chrome() {
  const n = cartCount(), b = $("#bagN");
  b.textContent = n > 9 ? "9+" : n;
  b.classList.toggle("on", n > 0);
  $("#favBtn").classList.toggle("act", S.favOnly);
  safe(() => view.name === "home" ? TG.BackButton.hide() : TG.BackButton.show());
  $("#hbk").style.display = (!IN_TG && view.name !== "home") ? "" : "none";
}

function openProduct(id) {
  const p = prod(id);
  if (!p) return;
  go({ name: "product", id, size: p.sizes.length === 1 ? p.sizes[0] : null, color: (p.colors && p.colors[0]) ? p.colors[0].name : "", photo: 0, added: false });
}

// ---------- экраны ----------
let cdTimer;
const dropLeft = () => { const t = Date.parse(CFG.dropDate || ""); if (!t) return null; const ms = t - Date.now(); return ms > 0 ? ms : null; };
function cdHtml(ms) {
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const cell = (n, l) => `<div><b>${String(n).padStart(2, "0")}</b><span>${l}</span></div>`;
  return cell(d, "дней") + cell(h, "часов") + cell(m, "минут") + cell(x, "секунд");
}

function filtered() {
  const q = norm(S.q);
  return PRODUCTS.filter(p =>
    (S.cat === "Все" || p.category === S.cat) &&
    (!S.favOnly || S.fav.includes(p.id)) &&
    (!q || norm(p.name + " " + (p.category || "")).includes(q)));
}
function cardHtml(p, i) {
  const fav = S.fav.includes(p.id);
  return `<div class="card" data-act="open" data-id="${p.id}" style="--i:${i}">
    ${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}
    <button class="heart ${fav ? "on" : ""}" data-act="fav" data-id="${p.id}" aria-label="В избранное">${I.heart}</button>
    ${phHtml(p, 0, true)}
    <div class="nm">${esc(p.name)}</div>
    <div class="pr">${money(p.price)}${p.oldPrice > p.price ? `<s>${money(p.oldPrice)}</s>` : ""}</div>
  </div>`;
}
function gridHtml() {
  const list = filtered();
  if (!list.length) {
    const msg = S.favOnly ? ["Избранное пусто", "Нажмите на сердце у вещи, которая понравилась"] : ["Ничего не нашли", "Измените запрос или выберите другую категорию"];
    return `<div class="empty" style="grid-column:1/-1">${I.search}<b>${msg[0]}</b><div>${msg[1]}</div></div>`;
  }
  return list.map(cardHtml).join("");
}
function updateGrid() {
  $("#grid").innerHTML = gridHtml();
  const c = $("#sc");
  if (c) c.textContent = String(filtered().length).padStart(2, "0") + " / " + String(PRODUCTS.length).padStart(2, "0");
}
function chipsHtml() {
  const cats = ["Все", ...new Set(PRODUCTS.map(p => p.category).filter(Boolean))];
  return cats.map(c => `<button class="chip ${S.cat === c ? "on" : ""}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join("");
}

function viewHome() {
  const hero = CFG.hero || {};
  const lines = String(hero.title || CFG.shopName || "").split("\n");
  const last = lines.pop();
  const titleHtml = lines.map(esc).join("<br>") + `<em>${esc(last)}</em>`;
  const ms = dropLeft();
  const ticker = [...(CFG.ticker || [])];
  if (CFG.freeShipFrom > 0) ticker.unshift("Бесплатная доставка от " + money(CFG.freeShipFrom));
  const tk = ticker.map(t => `<span>${esc(t)}</span>`).join("");
  return `
  <section class="hero">
    <div class="rose">${roseSvg()}</div>
    ${hero.eyebrow ? `<span class="tape">${esc(hero.eyebrow)}</span>` : ""}
    <h1>${titleHtml}</h1>
    <p>${esc(hero.subtitle || "")}</p>
    ${ms ? `<div class="cdl">${esc(CFG.dropLabel || "До следующего дропа")}</div><div class="cd" id="cd">${cdHtml(ms)}</div>` : ""}
    <button class="cta" data-act="toGrid">Смотреть коллекцию ${I.arrow}</button>
  </section>
  ${ticker.length ? `<div class="tick"><div>${tk}${tk}${tk}${tk}</div></div>` : ""}
  <button class="rl-b" data-act="roulette">
    <div><b>Оракул</b><span>Вытяните карту, и она подскажет, что надеть сегодня</span></div>
    <i>${roseSvg()}</i>
  </button>
  <div class="shead"><h2>Коллекция</h2><span id="sc">${String(filtered().length).padStart(2, "0")} / ${String(PRODUCTS.length).padStart(2, "0")}</span></div>
  <div class="search">${I.search}<input id="q" type="search" placeholder="Поиск по каталогу" value="${esc(S.q)}" autocomplete="off"></div>
  <div class="chips" id="chips">${chipsHtml()}</div>
  <div class="grid" id="grid">${gridHtml()}</div>`;
}

function similar(p) {
  const same = PRODUCTS.filter(x => x.id !== p.id && x.category === p.category);
  const rest = PRODUCTS.filter(x => x.id !== p.id && x.category !== p.category);
  return same.concat(rest).slice(0, 6);
}

function viewProduct() {
  const p = prod(view.id);
  const n = Math.max(photos(p).length, 1);
  const cur0 = view.photo || 0;
  const slides = Array.from({ length: n }, (_, i) => phHtml(p, i)).join("");
  const fav = S.fav.includes(p.id);
  const sizes = p.sizes.map(s => `<button class="sz ${view.size === s ? "on" : ""}" data-act="size" data-v="${esc(s)}">${esc(s)}</button>`).join("");
  const colors = (p.colors || []).map(c => `<button class="sw ${view.color === c.name ? "on" : ""}" data-act="color" data-v="${esc(c.name)}" style="--c:${esc(c.hex)}" aria-label="${esc(c.name)}"></button>`).join("");
  const sim = similar(p);
  const info = CFG.info || {};
  return `
  <div class="arch">
    <div class="gwrap"><div class="gal" id="gal">${slides}</div></div>
    <svg class="archline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="a2" d="M3 100V31C3 18 31 9 50 4C69 9 97 18 97 31V100"/><path class="a1" d="M0 100V30C0 14 30 5 50 0C70 5 100 14 100 30V100"/></svg>
    ${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}
    <button class="heart ${fav ? "on" : ""}" data-act="fav" data-id="${p.id}" aria-label="В избранное">${I.heart}</button>
    ${n > 1 ? `<div class="cnt" id="cnt">${cur0 + 1} / ${n}</div>` : ""}
  </div>
  ${n > 1 ? `<div class="dots" id="dots">${Array.from({ length: n }, (_, i) => `<i class="${i === cur0 ? "on" : ""}"></i>`).join("")}</div>` : ""}
  <h1 class="pname">${esc(p.name)}</h1>
  <div class="pprice">${money(p.price)}${p.oldPrice > p.price ? `<s>${money(p.oldPrice)}</s>` : ""}</div>
  ${p.desc ? `<p class="pdesc">${esc(p.desc)}</p>` : ""}
  ${colors ? `<div class="lbl"><span>Цвет<b id="cname">${esc(view.color || "")}</b></span></div><div class="opts">${colors}</div>` : ""}
  <div class="lbl"><span>Размер</span>${CFG.sizeGuide ? `<button data-act="sizeGuide">Таблица размеров</button>` : ""}</div>
  <div class="opts" id="szs">${sizes}</div>
  <div style="margin-top:28px">
    ${info.delivery ? `<details class="acc"><summary>Доставка</summary><p>${esc(info.delivery)}</p></details>` : ""}
    ${info.returns ? `<details class="acc"><summary>Возврат и обмен</summary><p>${esc(info.returns)}</p></details>` : ""}
  </div>
  ${sim.length ? `<div class="lbl" style="margin-top:30px"><span>Похожие вещи</span></div>
  <div class="rowh">${sim.map(x => `<div class="mini" data-act="open" data-id="${x.id}">${phHtml(x, 0)}<div class="nm">${esc(x.name)}</div><div class="pr">${money(x.price)}</div></div>`).join("")}</div>` : ""}`;
}

function afterProduct() {
  const g = $("#gal");
  if (g) {
    g.scrollLeft = (view.photo || 0) * g.clientWidth;
    g.addEventListener("scroll", () => {
      const i = Math.round(g.scrollLeft / (g.clientWidth || 1)) || 0;
      if (i === (view.photo || 0)) return;
      view.photo = i;
      $$("#dots i").forEach((d, k) => d.classList.toggle("on", k === i));
      const c = $("#cnt"); if (c) c.textContent = (i + 1) + " / " + $$("#gal .ph").length;
      hap.sel();
    }, { passive: true });
  }
  syncProductMain();
}

function syncProductMain() {
  const p = prod(view.id);
  if (view.added) setMain("Открыть корзину", () => go({ name: "cart" }));
  else if (!view.size) setMain("Выберите размер", () => {
    shake($("#szs")); hap.warn(); toast("Выберите размер");
    const el = $("#szs"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "smooth" });
  });
  else setMain("В корзину · " + money(p.price), addToCart);
}

function addToCart() {
  const p = prod(view.id);
  const it = { id: p.id, size: view.size, color: view.color || "", qty: 1 };
  const ex = S.cart.find(i => keyOf(i) === keyOf(it));
  if (ex) ex.qty = Math.min(ex.qty + 1, 20); else S.cart.push(it);
  store("cart", S.cart);
  hap.ok();
  fly($("#gal"));
  view.added = true;
  syncProductMain();
  chrome();
  toast("Добавлено в корзину");
}

function viewCart() {
  if (!S.cart.length) return `<div class="empty">${I.bag}<b>Корзина пуста</b><div>Выберите вещь в каталоге и добавьте её сюда</div></div>`;
  const c = calc(null);
  const items = S.cart.map(i => {
    const p = prod(i.id), k = esc(keyOf(i));
    return `<div class="it">
      <button class="rm" data-act="del" data-k="${k}" aria-label="Удалить">×</button>
      <div data-act="open" data-id="${p.id}">${phHtml(p, 0)}</div>
      <div class="inf">
        <div class="nm">${esc(p.name)}</div>
        <div class="sub">${esc(i.size)}${i.color ? " · " + esc(i.color) : ""}</div>
        <div class="row">
          <div class="qty"><button data-act="minus" data-k="${k}" aria-label="Меньше">−</button><span>${i.qty}</span><button data-act="plus" data-k="${k}" aria-label="Больше">+</button></div>
          <b>${money(p.price * i.qty)}</b>
        </div>
      </div></div>`;
  }).join("");
  let ship = "";
  if (c.thr > 0) {
    const left = c.thr - c.sub;
    ship = `<div class="ship">${left > 0 ? `Добавьте ещё на <b>${money(left)}</b>, и доставка будет бесплатной` : `<b>Бесплатная доставка включена</b>`}
      <div class="bar"><i data-w="${Math.min(100, Math.round(c.sub / c.thr * 100))}"></i></div></div>`;
  }
  const pr = c.promo;
  const promoBox = pr
    ? `<div class="pchip"><div><b>${esc(pr.label || "Промокод")} ${pr.percent > 0 ? "+" : "−"}${Math.abs(pr.percent)}%</b><small>${esc(pr.note || "«" + pr.code + "»")}</small></div><button data-act="promoOff" aria-label="Убрать промокод">×</button></div>`
    : `<div class="promo"><input class="inp" id="promo" placeholder="Промокод" autocomplete="off" autocapitalize="off"><button class="btn2" data-act="promoOn">Применить</button></div>`;
  return `<h2 class="h2">Корзина</h2>${ship}${items}${promoBox}
  <div class="sum">
    <div class="ln"><span>Товары (${cartCount()})</span><span>${money(c.goods)}</span></div>
    ${pr ? `<div class="ln"><span>${esc(pr.label || "Промокод")}</span><span class="g">${signed(c.adj)}</span></div>` : ""}
    <div class="ln"><span>Доставка</span><span>на следующем шаге</span></div>
    <div class="ln t"><span>Сумма заказа</span><span>${money(c.sub)}</span></div>
  </div>`;
}
function afterCart() {
  requestAnimationFrame(() => requestAnimationFrame(() => $$(".bar i").forEach(i => { i.style.width = i.dataset.w + "%"; })));
  if (S.cart.length) setMain("Оформить заказ · " + money(calc(null).sub), () => go({ name: "checkout" }));
  else setMain("В каталог", () => go({ name: "home" }, { reset: true }));
}

function optHtml(d) {
  const r = calc(d.id);
  return `<button class="opt" data-act="delivery" data-id="${esc(d.id)}"><span class="rd"></span><div>${esc(d.name)}<small>${esc(d.note || "")}</small></div><em>${r.ship === 0 ? "Бесплатно" : money(r.ship)}</em></button>`;
}
function summaryHtml(c) {
  return `<div class="ln"><span>Товары (${cartCount()})</span><span>${money(c.goods)}</span></div>
    ${c.promo ? `<div class="ln"><span>${esc(c.promo.label || "Промокод")}</span><span class="g">${signed(c.adj)}</span></div>` : ""}
    <div class="ln"><span>Доставка${c.dl ? " · " + esc(c.dl.name) : ""}</span><span>${c.ship === 0 ? "Бесплатно" : money(c.ship)}</span></div>
    <div class="ln t"><span>Итого</span><span>${money(c.total)}</span></div>`;
}
function viewCheckout() {
  if (!(CFG.delivery || []).some(d => d.id === S.delivery)) S.delivery = CFG.delivery[0].id;
  const f = S.form;
  return `
  ${!IN_TG && !PREVIEW ? `<div class="notg">Чтобы оформить заказ, откройте магазин в Telegram.</div>` : ""}
  <h2 class="h2">Оформление</h2>
  <div class="sec" style="margin-top:4px">Контакты</div>
  <div class="field"><input class="inp" id="f_name" data-f="name" placeholder="Имя" value="${esc(f.name)}" autocomplete="name"></div>
  <div class="field"><input class="inp" id="f_phone" data-f="phone" type="tel" inputmode="tel" placeholder="Телефон" value="${esc(f.phone)}" autocomplete="tel"></div>
  <div class="sec">Доставка</div>
  <div id="opts">${CFG.delivery.map(optHtml).join("")}</div>
  <div class="field" id="addrBox"><textarea class="inp" id="f_address" data-f="address" rows="3" placeholder="Город, улица, дом, квартира">${esc(f.address)}</textarea></div>
  <div class="field"><textarea class="inp" id="f_comment" data-f="comment" rows="2" placeholder="Комментарий к заказу (необязательно)">${esc(f.comment)}</textarea></div>
  <div class="sec">Итого</div>
  <div class="sum" id="sumBox"></div>
  <p class="note">Оплата после подтверждения: менеджер напишет вам в Telegram.</p>`;
}
function syncCheckout() {
  const c = calc(S.delivery);
  $("#addrBox").style.display = (c.dl && c.dl.needAddress) ? "" : "none";
  $("#sumBox").innerHTML = summaryHtml(c);
  $$(".opt").forEach(b => b.classList.toggle("on", b.dataset.id === S.delivery));
  setMain("Подтвердить заказ · " + money(c.total), submit);
}

let sending = false;
async function submit() {
  if (sending) return;
  const c = calc(S.delivery), f = S.form;
  const bad = [];
  if (f.name.trim().length < 2) bad.push("f_name");
  if (f.phone.replace(/\D/g, "").length < 10) bad.push("f_phone");
  if (c.dl.needAddress && f.address.trim().length < 5) bad.push("f_address");
  if (bad.length) {
    bad.forEach(id => { const el = $("#" + id); el.classList.add("err"); shake(el); });
    const first = $("#" + bad[0]); if (first.scrollIntoView) first.scrollIntoView({ block: "center", behavior: "smooth" });
    hap.warn(); toast("Проверьте выделенные поля");
    return;
  }
  if (!IN_TG && !PREVIEW) { hap.warn(); toast("Откройте магазин в Telegram, чтобы оформить заказ"); return; }
  sending = true; progress(true);
  try {
    let res;
    if (IN_TG) {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          initData: TG.initData,
          items: S.cart.map(i => ({ id: i.id, size: i.size, color: i.color, qty: i.qty })),
          customer: f, delivery: S.delivery, promo: S.promo || ""
        })
      });
      res = await r.json();
      if (!r.ok || !res.ok) throw new Error(res.error || "ошибка сервера");
    } else {
      res = { ok: true, orderId: "PREV01", total: c.total };   // только для ?preview=1
    }
    store("form", f); store("delivery", S.delivery);
    const done = { name: "done", id: res.orderId, total: res.total, count: cartCount() };
    S.cart = []; S.promo = ""; store("cart", S.cart); store("promo", "");
    go(done, { reset: true });
  } catch (e) {
    hap.warn(); notify("Не удалось отправить заказ: " + e.message);
  } finally {
    sending = false; progress(false);
  }
}

function viewDone() {
  return `<div class="tkt">
    <span class="stamp">Принят</span>
    <div class="num">№ ${esc(view.id)}</div>
    <div class="mu">${view.count} ${plural(view.count)} на ${money(view.total)}</div>
    <div class="perf"></div>
    <p class="pay">${esc(CFG.payText || "Мы скоро свяжемся с вами.")}</p>
  </div>
  <p class="thx">Спасибо, что с нами</p>`;
}

const VIEWS = {
  home: [viewHome, () => {
    clearInterval(cdTimer);
    cdTimer = setInterval(() => {
      const el = $("#cd"), ms = dropLeft();
      if (!el || ms == null) { clearInterval(cdTimer); return; }
      el.innerHTML = cdHtml(ms);
    }, 1000);
    S.cart.length ? setMain("Корзина · " + money(calc(null).sub), () => go({ name: "cart" })) : setMain("");
  }],
  product: [viewProduct, afterProduct],
  cart: [viewCart, afterCart],
  checkout: [viewCheckout, syncCheckout],
  done: [viewDone, () => { confetti(); hap.ok(); setMain("Закрыть", () => IN_TG ? safe(() => TG.close()) : go({ name: "home" }, { reset: true })); }]
};

function render(anim = true) {
  clearInterval(cdTimer);
  const [html, after] = VIEWS[view.name];
  app.innerHTML = `<div class="view${anim ? "" : " na"}">${html()}</div>`;
  chrome();
  after();
}

// ---------- Оракул (карты таро) и тайная комната ----------
const ARCANA = [["0", "Шут"], ["I", "Маг"], ["II", "Жрица"], ["IV", "Император"], ["VII", "Колесница"], ["IX", "Отшельник"], ["X", "Колесо Фортуны"], ["XIII", "Смерть"], ["XV", "Дьявол"], ["XVI", "Башня"], ["XVII", "Звезда"], ["XVIII", "Луна"], ["XIX", "Солнце"]];
function roulette() {
  if (!PRODUCTS.length) return;
  closeSheet();
  const pick = PRODUCTS[Math.random() * PRODUCTS.length | 0];
  const ar = ARCANA[Math.random() * ARCANA.length | 0];
  const lines = ["Эта вещь ваша", "Карта выбрала вас", "Судьба одета", "Брат, бери"];
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="rl"><h3>Оракул</h3>
    <div class="tarot"><div class="tin shuf" id="tin">
      <div class="face back">${roseSvg()}</div>
      <div class="face front"><div class="rn">${ar[0]}</div><div class="rc">${ar[1]}</div>${phHtml(pick, 0)}<div class="tn">${esc(pick.name)}</div><div class="tp">${money(pick.price)}</div></div>
    </div></div>
    <div class="mu" id="rlt">Тасуем колоду…</div></div>`;
  document.body.appendChild(ov);
  let finished = false;
  const timers = [];
  const buzz = setInterval(hap.sel, 140);
  const finish = () => {
    if (finished) return; finished = true;
    clearInterval(buzz); timers.forEach(clearTimeout);
    ov.remove(); openProduct(pick.id);
  };
  ov.addEventListener("click", finish);
  timers.push(setTimeout(() => {
    clearInterval(buzz);
    const t = $("#tin"); if (!t) return;
    t.classList.remove("shuf"); void t.offsetWidth; t.classList.add("flip");
    $("#rlt").textContent = lines[Math.random() * lines.length | 0];
    hap.ok();
  }, 1500));
  timers.push(setTimeout(finish, 3600));
}

function secret() {
  hap.ok(); confetti();
  const p = (CFG.promos || [])[0];
  openSheet(p
    ? `<h3 class="sh">Тайная комната</h3>
       <p class="mu">Вы нашли дверь, которую видят не все. Ваш промокод:</p>
       <div class="code">${esc(p.code)}</div>
       <p class="mu sm" style="margin-bottom:16px">Спойлер: ${esc(p.spoiler || "условия смотрите в корзине")}</p>
       <button class="cta wide" data-act="usePromo">Применить</button>`
    : `<h3 class="sh">Здесь пока пусто</h3><p class="mu">Загляните сюда позже.</p>`);
}

// ---------- действия ----------
function cartChanged() { store("cart", S.cart); hap.tap(); render(false); }
function toggleFav(id) {
  const i = S.fav.indexOf(id);
  i >= 0 ? S.fav.splice(i, 1) : S.fav.push(id);
  store("fav", S.fav); hap.tap();
  const on = S.fav.includes(id);
  $$(`.heart[data-id="${id}"]`).forEach(h => h.classList.toggle("on", on));
  if (view.name === "home" && S.favOnly && !on) updateGrid();
  if (on) toast("В избранном");
}
let logoTaps = 0, logoT;
const A = {
  open: el => openProduct(+el.dataset.id),
  fav: el => toggleFav(+el.dataset.id),
  back: () => back(),
  logo: () => {
    logoTaps++; clearTimeout(logoT); logoT = setTimeout(() => { logoTaps = 0; }, 2200);
    if (logoTaps >= 5) { logoTaps = 0; secret(); return; }
    if (view.name !== "home") go({ name: "home" }, { reset: true });
  },
  bag: () => { if (view.name !== "cart") go({ name: "cart" }); },
  favFilter: () => {
    S.favOnly = !S.favOnly; hap.sel();
    if (view.name !== "home") go({ name: "home" }, { reset: true });
    else { updateGrid(); chrome(); }
  },
  cat: el => { S.cat = el.dataset.v; hap.sel(); $("#chips").innerHTML = chipsHtml(); updateGrid(); },
  toGrid: () => { const s = $(".shead"); if (s && s.scrollIntoView) s.scrollIntoView({ behavior: "smooth", block: "start" }); },
  roulette,
  size: el => {
    view.size = el.dataset.v; view.added = false; hap.sel();
    $$('[data-act="size"]').forEach(b => b.classList.toggle("on", b === el));
    syncProductMain();
  },
  color: el => {
    view.color = el.dataset.v; view.added = false; hap.sel();
    $$('[data-act="color"]').forEach(b => b.classList.toggle("on", b === el));
    $("#cname").textContent = view.color;
    syncProductMain();
  },
  sizeGuide: () => {
    const g = CFG.sizeGuide;
    openSheet(`<h3 class="sh">Таблица размеров</h3>
      <table class="sg"><tr>${g.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>
      ${g.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>
      <p class="mu sm">${esc(g.note || "")}</p>`);
  },
  plus: el => { const i = S.cart.find(x => keyOf(x) === el.dataset.k); if (i) i.qty = Math.min(i.qty + 1, 20); cartChanged(); },
  minus: el => {
    const i = S.cart.find(x => keyOf(x) === el.dataset.k);
    if (i) { i.qty--; if (i.qty <= 0) S.cart = S.cart.filter(x => x !== i); }
    cartChanged();
  },
  del: el => { S.cart = S.cart.filter(x => keyOf(x) !== el.dataset.k); cartChanged(); },
  promoOn: () => {
    const inp = $("#promo"), p = findPromo(inp.value);
    if (!p) { inp.classList.add("err"); shake(inp); hap.warn(); toast("Такого промокода нет"); return; }
    S.promo = p.code; store("promo", S.promo);
    hap.ok(); confetti(); render(false);
    toast(p.toast || "Промокод применён", 3600);
  },
  promoOff: () => { S.promo = ""; store("promo", ""); hap.tap(); render(false); },
  usePromo: () => {
    const p = (CFG.promos || [])[0]; if (!p) return;
    S.promo = p.code; store("promo", S.promo); closeSheet(); hap.ok();
    if (view.name === "cart") render(false);
    toast(p.toast || "Промокод применён", 3600);
  },
  delivery: el => { S.delivery = el.dataset.id; hap.sel(); syncCheckout(); },
  reload: () => location.reload()
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.f) { S.form[t.dataset.f] = t.value; t.classList.remove("err"); }
  else if (t.id === "q") { S.q = t.value; updateGrid(); }
  else if (t.id === "promo") t.classList.remove("err");
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "promo") A.promoOn();
});

// ---------- заставка и запуск ----------
function startSplash() {
  const sp = $("#splash");
  let seen = false;
  safe(() => { seen = !!sessionStorage.getItem("sp"); sessionStorage.setItem("sp", "1"); });
  if (seen || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) { sp.remove(); return; }
  $("#spr").innerHTML = roseSvg();
  $("#spw").innerHTML = Array.from(titleCase(CFG.shopName)).map((ch, i) => `<span style="--i:${i}">${ch === " " ? "&nbsp;" : esc(ch)}</span>`).join("");
  $("#spt").textContent = CFG.tagline || "";
  const off = () => { sp.classList.add("hide"); setTimeout(() => sp.remove(), 700); };
  sp.addEventListener("click", off);
  setTimeout(off, 1900);
}

async function boot() {
  try {
    const r = await fetch("products.json?t=" + Date.now());
    const d = await r.json();
    CFG = d.settings || {};
    PRODUCTS = d.products || [];
    if (!PRODUCTS.length) throw new Error("empty");
  } catch (e) {
    $("#splash").remove();
    app.innerHTML = `<div class="empty">${I.bag}<b>Каталог недоступен</b><div style="margin-bottom:16px">Проверьте соединение и обновите страницу</div><button class="cta" data-act="reload">Обновить</button></div>`;
    return;
  }
  if (!CFG.delivery || !CFG.delivery.length) CFG.delivery = [{ id: "pickup", name: "Самовывоз", note: "", price: 0, needAddress: false }];
  document.title = CFG.shopName || "Магазин";
  $("#brandName").textContent = titleCase(CFG.shopName) || "Магазин";
  $("#brandTag").textContent = CFG.tagline || "";
  // убрать из корзины то, чего больше нет в каталоге
  S.cart = S.cart.filter(i => {
    const p = prod(i.id);
    return p && p.sizes.includes(i.size) && (!(p.colors || []).length || p.colors.some(c => c.name === i.color));
  }).map(i => ({ id: i.id, size: i.size, color: i.color || "", qty: Math.min(Math.max(i.qty | 0, 1), 20) }));
  S.fav = S.fav.filter(id => prod(id));
  if (S.promo && !findPromo(S.promo)) S.promo = "";
  render();
  startSplash();
}
boot();
})();
</script>
