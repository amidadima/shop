<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Магазин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Grenze+Gotisch:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0a0a; --s1:#131314; --s2:#1b1b1d; --line:rgba(255,255,255,.1);
  --tx:#f4f2ed; --mu:#8f8d87; --acc:#f4f2ed; --acc2:#ffffff; --ink:#0a0a0a; --red:#e5645b;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --goth:"Grenze Gotisch",var(--serif);
  --sans:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
img{display:block}
.serif{font-family:var(--serif)}
.goth{font-family:var(--goth)}
.mu{color:var(--mu)} .sm{font-size:12px}

.glass{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 14px 34px rgba(0,0,0,.35)}
.silver{background:linear-gradient(178deg,#ffffff 6%,#d8d6d1 44%,#96938d 78%,#eae8e3);
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- шапка ---------- */
#hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;
  background:rgba(10,10,10,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.hl{display:flex;align-items:center;gap:4px}.hr{display:flex;gap:2px}
.brand{display:flex;align-items:center;gap:10px;user-select:none;cursor:pointer;padding:4px 0}
.brand .em{width:20px;height:20px;flex:none}
.brand .lg{height:24px;width:auto}
.brand b{font:600 20px/1 var(--serif);letter-spacing:.14em}
.brand small{display:block;font:500 8px/1 var(--sans);letter-spacing:.32em;color:var(--mu);margin-top:4px;text-transform:uppercase}
.ic{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.ic svg{width:22px;height:22px}
.ic.act svg{fill:var(--acc);stroke:var(--acc)}
.ic .badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--acc);color:var(--ink);
  font:600 10px/17px var(--sans);text-align:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ic .badge.on{transform:scale(1)}
.ic.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.25)}}

#app{padding:0 16px 120px;min-height:80vh}
.view{animation:viewIn .4s cubic-bezier(.2,.8,.2,1)}
.view.na{animation:none}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}

/* ---------- главная ---------- */
.hero{position:relative;margin-top:14px;padding:32px 22px 26px;border-radius:26px;overflow:hidden;
  background:radial-gradient(120% 90% at 85% -10%,rgba(244,242,237,.10),transparent 55%),linear-gradient(165deg,#161616,#0a0a0a 62%)}
.hero .wm{position:absolute;top:-34px;right:-46px;z-index:0;font:500 150px/.8 var(--serif);letter-spacing:-.05em;
  color:transparent;-webkit-text-stroke:1px rgba(244,242,237,.09);transform:rotate(4deg);user-select:none;pointer-events:none}
.hero .frame{position:absolute;inset:10px;border:1px solid rgba(244,242,237,.1);border-radius:18px;pointer-events:none}
.hero .frame::before,.hero .frame::after{content:"";position:absolute;width:14px;height:14px;border:1px solid rgba(244,242,237,.28)}
.hero .frame::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.hero .frame::after{bottom:-1px;right:-1px;border-left:none;border-top:none}
.hero::before{content:"";position:absolute;width:360px;height:360px;right:-130px;top:-150px;background:radial-gradient(circle,rgba(244,242,237,.16),transparent 65%);animation:float 9s ease-in-out infinite;pointer-events:none}
.hero::after{content:"";position:absolute;width:260px;height:260px;left:-130px;bottom:-160px;background:radial-gradient(circle,rgba(244,242,237,.08),transparent 65%);animation:float 12s ease-in-out infinite reverse;pointer-events:none}
@keyframes float{50%{transform:translate(-18px,14px) scale(1.08)}}
.hero>*{position:relative;z-index:1}
/* эмблема в hero: еле заметная, за отсчётом */
.bigmoon{position:absolute;right:18px;top:76px;width:150px;height:150px;object-fit:contain;opacity:.1;z-index:0;pointer-events:none;animation:moonfloat 14s ease-in-out infinite}
@keyframes moonfloat{50%{transform:translate(-6px,-10px) rotate(-4deg)}}
.eyebrow{font:500 10px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--mu)}
.hero .eyebrow{color:var(--tx)}
.hero h1{font:500 44px/1.02 var(--serif);margin:14px 0 12px;letter-spacing:-.01em;max-width:280px}
.hero h1 em{font-style:italic;color:var(--acc2)}
.hero p{color:var(--mu);max-width:280px}
.cdl{font-size:12px;color:var(--mu);margin-top:18px;letter-spacing:.06em}
.srnum{font:500 15px/1 var(--serif);font-variant-numeric:tabular-nums;color:var(--tx);letter-spacing:.04em}
.srnum.hot{color:var(--acc2)}
.cta{margin-top:20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:30px;
  background:linear-gradient(180deg,#ffffff,#d9d6d1);color:var(--ink);font-weight:600;font-size:13px;letter-spacing:.04em;transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta svg{width:16px;height:16px;stroke-width:2}
.cta.wide{width:100%}

.tick{margin:16px -16px 0;overflow:hidden;border-block:1px solid var(--line);padding:11px 0;white-space:nowrap}
.tick div{display:inline-block;animation:mq 30s linear infinite;font:400 15px/1 var(--goth);letter-spacing:.1em;text-transform:lowercase;color:var(--mu)}
.tick span{margin:0 18px}
.tick span::after{content:"✦";margin-left:36px;color:var(--acc)}
@keyframes mq{to{transform:translateX(-50%)}}

.search{position:relative;margin-top:18px;scroll-margin-top:70px}
.search input{width:100%;padding:13px 16px 13px 44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx);font:inherit;outline:none;transition:border-color .2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.search input:focus{border-color:rgba(244,242,237,.4)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:30px;border:1px solid var(--line);color:var(--mu);font-size:13px;transition:.2s;background:rgba(255,255,255,.02)}
.chip.on{background:var(--tx);color:var(--ink);border-color:var(--tx);font-weight:500}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;margin-top:12px}
.card{position:relative;animation:rise .55s both;animation-delay:calc(var(--i,0)*50ms);cursor:pointer}
.card:active .ph{transform:scale(.985)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.ph{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;transition:transform .2s;display:grid;place-items:center;
  background:linear-gradient(rgba(12,12,13,.66),rgba(12,12,13,.66)),url("emb_white.svg") center/32% no-repeat,linear-gradient(160deg,#1d1d1f,#0f0f11)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .nm{margin-top:10px;font-size:15px;line-height:1.3;font-weight:500;letter-spacing:.08em}
.card .ct{font-size:11px;color:var(--mu);margin-top:1px}
.pr{font-weight:600;margin-top:3px}
.pr s{color:var(--mu);font-weight:400;margin-left:6px;font-size:13px}
.tag{position:absolute;top:10px;left:10px;z-index:2;padding:5px 9px;border-radius:20px;background:rgba(10,10,10,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(244,242,237,.35);color:var(--tx);font:500 9px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase}
.soon{opacity:.55}
.heart{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(10,10,10,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.heart svg{width:17px;height:17px;stroke:var(--tx);transition:.25s}
.heart.on svg{fill:var(--acc);stroke:var(--acc);animation:pop .4s}
@keyframes pop{50%{transform:scale(1.35)}}

.empty{text-align:center;padding:64px 20px;color:var(--mu)}
.empty .emk{display:block;width:44px;height:44px;opacity:.45;margin:0 auto 16px}
.empty .emk img{display:block;width:100%;height:100%;object-fit:contain}
.empty b{display:block;font:500 28px/1.1 var(--serif);color:var(--tx);margin-bottom:6px}
.sk{border-radius:var(--r);aspect-ratio:4/5;background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%);background-size:200% 100%;animation:shim 1.4s infinite}
@keyframes shim{to{background-position:-200% 0}}

.sec{margin:30px 0 12px;font:400 21px/1 var(--goth);letter-spacing:.05em;color:var(--mu)}
.rowh{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.rowh::-webkit-scrollbar{display:none}
.mini{flex:none;width:132px}
.mini .nm{font-size:15px;margin-top:8px;line-height:1.25;font-weight:500;letter-spacing:.08em}
.mini .pr{font-size:12px;color:var(--mu);font-weight:400;margin-top:1px}

.ft{margin:52px 0 0;text-align:center}
.ft .fl{height:20px;width:auto;margin:0 auto 14px;opacity:.55}
.ft .fg{font:400 26px/1 var(--goth);color:var(--mu);letter-spacing:.06em}
.ft span{display:block;margin-top:10px;font-size:11px;letter-spacing:.08em;color:var(--mu);opacity:.75}

/* ---------- товар ---------- */
.pwrap{position:relative}
.pghost{position:absolute;top:-36px;right:-4px;z-index:0;font:500 128px/.9 var(--serif);letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1px rgba(244,242,237,.1);pointer-events:none;user-select:none}
.gwrap{position:relative;margin-top:40px;border-radius:24px;overflow:hidden;z-index:1}
.gwrap .heart{top:14px;right:14px}
.gwrap .tag{top:18px;left:16px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .ph{flex:none;width:100%;border-radius:0;scroll-snap-align:center}
.cnt{position:absolute;right:14px;bottom:14px;z-index:2;padding:6px 11px;border-radius:20px;background:rgba(10,10,10,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:500 11px/1 var(--sans);letter-spacing:.1em}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--mu);opacity:.4;transition:.3s}
.dots i.on{width:20px;background:var(--acc);opacity:1}
.pname{font:500 42px/1 var(--serif);margin-top:16px;letter-spacing:.08em}
.ptype{color:var(--mu);margin-top:4px;font-size:13px}
.pprice{font:600 22px/1 var(--sans);margin-top:12px}
.pprice s{font-weight:400;font-size:15px;color:var(--mu);margin-left:8px}
.pdesc{color:var(--mu);margin-top:12px}
.lbl{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px;font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.lbl b{color:var(--tx);font-weight:500;letter-spacing:.04em;text-transform:none;font-size:13px;margin-left:8px}
.lbl button{color:var(--tx);letter-spacing:.04em;text-transform:none;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:52px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:500;transition:.2s}
.sz.on{background:var(--tx);color:var(--ink);border-color:var(--tx)}
.sw{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--c);position:relative;margin:5px}
.sw.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--acc)}
.acc{border-top:1px solid var(--line)}
.acc:last-of-type{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:500;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--acc);font-size:22px;line-height:1;transition:.2s}
.acc[open] summary::after{transform:rotate(45deg)}
.acc p{padding:0 0 16px;color:var(--mu)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- корзина и оформление ---------- */
.h2{font:500 36px/1 var(--serif);margin:24px 0 16px}
.it{position:relative;display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center;padding:12px;margin-bottom:10px;border-radius:var(--r)}
.it .ph{border-radius:12px;aspect-ratio:3/4}
.it .inf{min-width:0;padding-right:20px}
.it .nm{font-size:14px;line-height:1.25;font-weight:500;letter-spacing:.08em}
.it .sub{font-size:12px;color:var(--mu);margin-top:2px}
.it .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.rm{position:absolute;top:6px;right:8px;width:28px;height:28px;font-size:22px;line-height:1;color:var(--mu)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:30px;padding:2px}
.qty button{width:30px;height:30px;border-radius:50%;font-size:18px}
.qty span{min-width:24px;text-align:center;font-weight:500;font-size:14px}
.ship{padding:14px 16px;margin-bottom:12px;border-radius:var(--r);font-size:13px;color:var(--mu)}
.ship b{color:var(--tx);font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--acc);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.promo{display:flex;gap:8px;margin:12px 0}
.inp{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx);font:inherit;outline:none;transition:border-color .2s}
.inp:focus{border-color:rgba(244,242,237,.5)}
.inp.err{border-color:var(--red)}
textarea.inp{resize:none;display:block}
.btn2{padding:0 18px;border-radius:14px;border:1px solid var(--acc);color:var(--tx);font-weight:500;white-space:nowrap}
.pchip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;margin:12px 0;border-radius:14px;border:1px dashed var(--acc);background:rgba(244,242,237,.06)}
.pchip small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.pchip button{font-size:24px;color:var(--mu);line-height:1}
.sum{padding:16px;border-radius:var(--r)}
.ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;color:var(--mu)}
.ln.t{color:var(--tx);font-weight:600;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.ln .g{color:var(--tx)}
.field{margin-bottom:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;border-radius:14px;transition:.2s}
.opt .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mu);flex:none;position:relative;transition:.2s}
.opt.on{border-color:var(--acc)}
.opt.on .rd{border-color:var(--acc)}
.opt.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--acc)}
.opt div{flex:1}
.opt small{display:block;color:var(--mu);font-size:12px}
.opt em{font-style:normal;font-weight:600}
.note{color:var(--mu);font-size:12px;margin-top:12px;text-align:center}
.notg{padding:14px 16px;margin-top:16px;border:1px solid var(--red);border-radius:14px;color:var(--red);font-size:13px}

/* ---------- заказ принят ---------- */
.tkt{position:relative;margin-top:26px;padding:34px 22px 28px;border-radius:22px;text-align:center;overflow:hidden;
  background:radial-gradient(130% 100% at 50% -20%,rgba(244,242,237,.09),transparent 55%),linear-gradient(170deg,#141414,#0a0a0a 70%)}
.tktm{display:block;width:34px;height:34px;margin:0 auto 18px}
.tktm img{display:block;width:100%;height:100%;object-fit:contain;opacity:.85}
.stamp{display:inline-block;padding:10px 18px;border:2px solid var(--acc);border-radius:8px;color:var(--tx);
  font:400 22px/1 var(--goth);letter-spacing:.12em;transform:rotate(-5deg) scale(2.2);opacity:0;animation:stamp .5s .3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{to{transform:rotate(-5deg) scale(1);opacity:1}}
.num{font:500 46px/1 var(--serif);margin:20px 0 6px;letter-spacing:.04em}
.perf{border-top:2px dashed var(--line);margin:24px -22px 20px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-12px}.perf::after{right:-12px}
.pay{white-space:pre-line;color:var(--mu)}
.thx{text-align:center;font:italic 500 24px/1.2 var(--serif);color:var(--mu);margin:26px 0}

/* ---------- слои ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;padding:22px 18px 34px;border-radius:26px 26px 0 0;
  background:rgba(19,19,20,.86);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 16px}
.sh{font:500 30px/1.1 var(--serif);margin-bottom:10px}
table.sg{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:12px}
.sg th,.sg td{padding:11px 6px;text-align:center;border-bottom:1px solid var(--line)}
.sg th{color:var(--tx);font:500 10px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.code{font:500 24px/1.2 var(--serif);text-align:center;padding:18px;border:1px dashed var(--acc);border-radius:14px;margin:14px 0;color:var(--tx)}
.fly{position:fixed;width:24px;height:24px;border-radius:50%;background:var(--acc);z-index:80;pointer-events:none;box-shadow:0 0 22px rgba(244,242,237,.7)}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);max-width:88vw;padding:12px 18px;border-radius:30px;background:rgba(244,242,237,.97);color:var(--ink);
  font-size:13px;font-weight:500;text-align:center;opacity:0;pointer-events:none;transition:.3s;z-index:90}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fb{position:fixed;left:16px;right:16px;bottom:16px;z-index:30;padding:16px;border-radius:14px;background:linear-gradient(180deg,#ffffff,#d9d6d1);color:var(--ink);font-weight:600;text-align:center;transform:translateY(150%);transition:transform .3s}
#fb.show{transform:none}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .6s,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash .sl{height:60px;width:auto;margin:0 auto;opacity:0;animation:ltr .6s .1s forwards}

<script>
(() => {
"use strict";

// ===== НАСТРОЙКА: адрес вашего Cloudflare Worker =====
const API_URL = "https://1401041.ddggoff.workers.dev";
// =====================================================

const TG = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(TG && TG.initData);
const PREVIEW = /[?&]preview=1/.test(location.search);   // просмотр дизайна в обычном браузере
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const app = $("#app");
const safe = fn => { try { return fn(); } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ").trim();
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const store = (k, v) => safe(() => localStorage.setItem(k, JSON.stringify(v)));
const hap = {
  sel() { safe(() => TG.HapticFeedback.selectionChanged()); },
  tap() { safe(() => TG.HapticFeedback.impactOccurred("light")); },
  ok() { safe(() => TG.HapticFeedback.notificationOccurred("success")); },
  warn() { safe(() => TG.HapticFeedback.notificationOccurred("warning")); }
};

safe(() => { TG.ready(); TG.expand(); });
safe(() => { TG.setHeaderColor("#0a0a0a"); TG.setBackgroundColor("#0a0a0a"); });
safe(() => { TG.setBottomBarColor("#0a0a0a"); });
safe(() => { TG.disableVerticalSwipes(); });

// ---------- иконки ----------
const svg = d => `<svg viewBox="0 0 24 24">${d}</svg>`;
const I = {
  heart: svg('<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>'),
  bag: svg('<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>'),
  back: svg('<path d="M15 18l-6-6 6-6"/>'),
  arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>')
};
$("#hbk").innerHTML = I.back;
$("#favBtn").innerHTML = I.heart;
$("#bagBtn").innerHTML = I.bag + '<span class="badge" id="bagN">0</span>';

// ---------- восход (настоящий) ----------
const SR_WIN = 5 * 60e3;                 // скидка действует 5 минут после восхода
const SR_DISC = -10;                     // процент скидки восхода
const SR = { lat: 55.7558, lon: 37.6173, rise: null, next: null };   // по умолчанию Москва
// восход по NOAA; возвращает ms UTC или null (полярный день/ночь)
function sunriseUTC(d, lat, lon) {
  const rad = Math.PI / 180;
  const N = Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5);
  const g = 2 * Math.PI / 365 * (N - 1);
  const cos = Math.cos, sin = Math.sin;
  const eqt = 229.18 * (0.000075 + 0.001868 * cos(g) - 0.032077 * sin(g) - 0.014615 * cos(2 * g) - 0.040849 * sin(2 * g));
  const decl = 0.006918 - 0.399912 * cos(g) + 0.070257 * sin(g) - 0.006758 * cos(2 * g) + 0.000907 * sin(2 * g) - 0.002697 * cos(3 * g) + 0.00148 * sin(3 * g);
  const cosH = (cos(90.833 * rad) - sin(lat * rad) * sin(decl)) / (cos(lat * rad) * cos(decl));
  if (cosH > 1 || cosH < -1) return null;
  const ha = Math.acos(cosH) / rad;
  const minUTC = 720 - 4 * (lon + ha) - eqt;          // минуты от полуночи UTC
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) + minUTC * 60e3;
}
function srUpdate(now = Date.now()) {
  const today = sunriseUTC(new Date(now), SR.lat, SR.lon);
  if (today != null && now >= today && now < today + SR_WIN) {   // окно скидки открыто
    SR.rise = today;
    SR.next = sunriseUTC(new Date(now + 864e5), SR.lat, SR.lon);
    return;
  }
  SR.rise = null;
  SR.next = today != null && now < today ? today : sunriseUTC(new Date(now + 864e5), SR.lat, SR.lon);
}
const srActive = () => SR.rise != null && Date.now() >= SR.rise && Date.now() < SR.rise + SR_WIN;
if (navigator.geolocation) {
  navigator.permissions && navigator.permissions.query({ name: "geolocation" }).then(st => {
    if (st.state !== "granted") return;
    navigator.geolocation.getCurrentPosition(p => { SR.lat = p.coords.latitude; SR.lon = p.coords.longitude; srUpdate(); }, () => {}, { timeout: 3000 });
  }).catch(() => {});
}

// ---------- состояние ----------
let CFG = {}, PRODUCTS = [];
const S = {
  cat: "Все", q: "", favOnly: false,
  cart: load("cart", []), fav: load("fav", []), promo: load("promo", ""),
  form: Object.assign({ name: "", phone: "", address: "", comment: "" }, load("form", {})),
  delivery: load("delivery", "")
};
if (!Array.isArray(S.cart)) S.cart = [];
if (!Array.isArray(S.fav)) S.fav = [];
if (!S.form.name) {
  const u = safe(() => TG.initDataUnsafe.user) || {};
  S.form.name = [u.first_name, u.last_name].filter(Boolean).join(" ");
}

// ---------- утилиты ----------
const prod = id => PRODUCTS.find(p => p.id === id);
const cur = () => CFG.currency || "₽";
const money = n => Number(n).toLocaleString("ru-RU") + " " + cur();
const photos = p => (p.imgs && p.imgs.length) ? p.imgs : (p.img ? [p.img] : []);
const keyOf = i => i.id + "|" + i.size + "|" + (i.color || "");
const cartCount = () => S.cart.reduce((s, i) => s + i.qty, 0);
const goodsSum = () => S.cart.reduce((s, i) => s + prod(i.id).price * i.qty, 0);
const phHtml = (p, i = 0) => {
  const u = photos(p)[i];
  return `<div class="ph">${u ? `<img src="${esc(u)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ""}</div>`;
};
const plural = n => { const a = n % 10, b = n % 100; return (a === 1 && b !== 11) ? "товар" : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? "товара" : "товаров"; };
const findPromo = code => code ? (CFG.promos || []).find(p => norm(p.code) === norm(code)) : null;
const signed = n => (n > 0 ? "+" : "−") + money(Math.abs(n));

// Расчёт суммы. Та же формула считается на сервере (worker.js)
function calc(deliveryId) {
  const goods = goodsSum();
  const promo = findPromo(S.promo);
  let adj = promo ? Math.round(goods * promo.percent / 100) : 0;
  let promoLabel = promo ? (promo.label || "Промокод") : "";
  if (srActive()) {   // скидка восхода автоматически, если выгоднее
    const srAdj = Math.round(goods * SR_DISC / 100);
    if (srAdj < adj) { adj = srAdj; promoLabel = "Восход −10%"; }
  }
  const sub = goods + adj;
  const dl = (CFG.delivery || []).find(d => d.id === deliveryId) || null;
  const thr = Number(CFG.freeShipFrom) || 0;
  const free = thr > 0 && sub >= thr;
  const ship = dl ? (free ? 0 : dl.price) : 0;
  return { goods, promo, promoLabel, adj, sub, dl, free, ship, total: sub + ship, thr };
}

// ---------- тосты, шторка, анимации ----------
let toastT;
function toast(m, ms = 2200) {
  const t = $("#toast");
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), ms);
}
function shake(el) { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function notify(m) { IN_TG ? safe(() => TG.showAlert(m)) : toast(m, 3600); }

let sheet = null;
function openSheet(html) {
  closeSheet();
  sheet = document.createElement("div");
  sheet.className = "ov";
  sheet.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
  document.body.appendChild(sheet);
}
function closeSheet() { if (sheet) { sheet.remove(); sheet = null; } }

function fly(fromEl) {
  const bag = $("#bagBtn");
  if (!fromEl || !bag) return;
  const a = fromEl.getBoundingClientRect(), b = bag.getBoundingClientRect();
  const d = document.createElement("div");
  d.className = "fly";
  const sx = a.left + a.width / 2, sy = a.top + Math.min(a.height / 2, 160);
  d.style.left = (sx - 12) + "px"; d.style.top = (sy - 12) + "px";
  document.body.appendChild(d);
  const done = () => { d.remove(); bag.classList.remove("bump"); void bag.offsetWidth; bag.classList.add("bump"); };
  if (!d.animate) return done();
  const an = d.animate([
    { transform: "translate(0,0) scale(1)", opacity: 1 },
    { transform: `translate(${b.left + b.width / 2 - sx}px,${b.top + b.height / 2 - sy}px) scale(.3)`, opacity: .5 }
  ], { duration: 650, easing: "cubic-bezier(.5,-.2,.7,1)" });
  an.onfinish = done;
}

// ---------- главная кнопка Telegram ----------
const fb = $("#fb");
let mainFn = null;
safe(() => TG.MainButton.onClick(() => mainFn && mainFn()));
fb.addEventListener("click", () => mainFn && mainFn());
function setMain(text, fn) {
  mainFn = fn || null;
  if (IN_TG) {
    if (!text) { safe(() => TG.MainButton.hide()); return; }
    safe(() => { TG.MainButton.setParams({ color: "#f4f2ed", text_color: "#0a0a0a" }); TG.MainButton.setText(text); TG.MainButton.show(); });
  } else {
    fb.textContent = text || "";
    fb.classList.toggle("show", !!text);
  }
}
function progress(on) {
  if (IN_TG) safe(() => on ? TG.MainButton.showProgress() : TG.MainButton.hideProgress());
  else fb.style.opacity = on ? .6 : 1;
}

// ---------- навигация ----------
let view = { name: "home" };
const stack = [];
function go(v, opt = {}) {
  view.scroll = window.scrollY;
  if (opt.reset) stack.length = 0; else stack.push(view);
  view = v;
  render();
  window.scrollTo(0, 0);
}
function back() {
  if (sheet) { closeSheet(); return; }
  view = stack.pop() || { name: "home" };
  render(false);
  window.scrollTo(0, view.scroll || 0);
}
safe(() => TG.BackButton.onClick(back));

function chrome() {
  const n = cartCount(), b = $("#bagN");
  b.textContent = n > 9 ? "9+" : n;
  b.classList.toggle("on", n > 0);
  $("#favBtn").classList.toggle("act", S.favOnly);
  safe(() => view.name === "home" ? TG.BackButton.hide() : TG.BackButton.show());
  $("#hbk").style.display = (!IN_TG && view.name !== "home") ? "" : "none";
}

function openProduct(id) {
  const p = prod(id);
  if (!p) return;
  go({ name: "product", id, size: p.sizes.length === 1 ? p.sizes[0] : null, color: (p.colors && p.colors[0]) ? p.colors[0].name : "", photo: 0, added: false });
}

// ---------- эмблема в hero (фон, нет интерактива) ----------
function emblemHtml() {
  return `<img class="bigmoon" src="emb_white.svg" alt="" aria-hidden="true" onerror="this.remove()">`;
}

// ---------- отсчёт до восхода ----------
let cdTimer;
function srClock() {
  const el = $("#sr");
  if (!el) { clearInterval(cdTimer); return; }
  srUpdate();
  const now = Date.now();
  if (srActive()) {
    const left = SR.rise + SR_WIN - now;
    const s = Math.max(0, Math.floor(left / 1000));
    el.textContent = `−${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    const t = $("#srtxt"); if (t) t.textContent = "Восход · −10%";
    el.classList.add("hot");
    return;
  }
  el.classList.remove("hot");
  const t = $("#srtxt"); if (t) t.textContent = "До восхода";
  if (SR.next == null) { el.textContent = "—"; return; }
  const left = Math.max(0, SR.next - now);
  const h = Math.floor(left / 36e5), m = Math.floor(left % 36e5 / 6e4), s = Math.floor(left % 6e4 / 1e3);
  el.textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function filtered() {
  const q = norm(S.q);
  return PRODUCTS.filter(p =>
    (S.cat === "Все" || p.category === S.cat) &&
    (!S.favOnly || S.fav.includes(p.id)) &&
    (!q || norm(p.name + " " + (p.category || "") + " " + (p.desc || "")).includes(q)));
}
function cardHtml(p, i) {
  const fav = S.fav.includes(p.id);
  return `<div class="card" data-act="open" data-id="${p.id}" style="--i:${i}">
    ${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}
    <button class="heart ${fav ? "on" : ""}" data-act="fav" data-id="${p.id}" aria-label="В избранное">${I.heart}</button>
    ${phHtml(p, 0)}
    <div class="nm silver">№ ${esc(p.name)}</div>
    <div class="ct">${esc(p.category)}</div>
    <div class="pr">${money(p.price)}${p.oldPrice > p.price ? `<s>${money(p.oldPrice)}</s>` : ""}</div>
  </div>`;
}
function gridHtml() {
  const list = filtered();
  if (!list.length) {
    const msg = S.favOnly ? ["Пока пусто", "Отмеченное сердечком будет здесь."] : ["Ничего не нашлось", "Попробуйте иначе."];
    return `<div class="empty" style="grid-column:1/-1"><span class="emk"><img src="emb_white.svg" alt=""></span><b>${msg[0]}</b><div>${msg[1]}</div></div>`;
  }
  return list.map(cardHtml).join("");
}
function chipsHtml() {
  const cats = ["Все", ...new Set(PRODUCTS.map(p => p.category).filter(Boolean))];
  return cats.map(c => `<button class="chip ${S.cat === c ? "on" : ""}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join("");
}
function upcomingHtml() {
  const u = CFG.upcoming || [];
  if (!u.length) return "";
  return `<div class="sec goth">Фаза 02 · скоро</div>
  <div class="rowh">${u.map(x => `<div class="mini soon">
    <div class="ph"></div>
    <div class="nm silver">№ ${esc(x.num)}</div>
    <div class="pr">${esc(x.type)} · скоро</div>
  </div>`).join("")}</div>`;
}

function viewHome() {
  const hero = CFG.hero || {};
  const lines = String(hero.title || CFG.shopName || "").split("\n");
  const last = lines.pop();
  const titleHtml = lines.map(esc).join("<br>") + (lines.length ? "<br>" : "") + `<em>${esc(last)}</em>`;
  const ticker = [...(CFG.ticker || [])];
  if (CFG.freeShipFrom > 0) ticker.unshift("От " + money(CFG.freeShipFrom) + " — доставка за наш счёт");
  const tk = ticker.map(t => `<span>${esc(t)}</span>`).join("");
  srUpdate();
  return `
  <section class="hero glass">
    <span class="wm" aria-hidden="true">1401041</span>
    <span class="frame" aria-hidden="true"></span>
    ${emblemHtml()}
    <div class="eyebrow">${esc(hero.eyebrow || "")}</div>
    <h1>${titleHtml}</h1>
    <p>${esc(hero.subtitle || "")}</p>
    <div class="cdl"><span id="srtxt">До восхода</span> · <b class="srnum" id="sr">--:--:--</b></div>
    <button class="cta" data-act="toGrid">Смотреть вещи ${I.arrow}</button>
  </section>
  ${ticker.length ? `<div class="tick"><div>${tk}${tk}${tk}${tk}</div></div>` : ""}
  <div class="chips" id="chips" style="margin-top:20px">${chipsHtml()}</div>
  <div class="sec goth" style="margin-top:26px">Фаза 01 · в наличии</div>
  <div class="grid" id="grid">${gridHtml()}</div>
  ${upcomingHtml()}
  <footer class="ft">
    <img class="fl" src="logo_white.svg" alt="" onerror="this.remove()">
  </footer>`;
}

function similar(p) {
  const same = PRODUCTS.filter(x => x.id !== p.id && x.category === p.category);
  const rest = PRODUCTS.filter(x => x.id !== p.id && x.category !== p.category);
  return same.concat(rest).slice(0, 6);
}

function viewProduct() {
  const p = prod(view.id);
  const n = Math.max(photos(p).length, 1);
  const cur0 = view.photo || 0;
  const slides = Array.from({ length: n }, (_, i) => phHtml(p, i)).join("");
  const fav = S.fav.includes(p.id);
  const sizes = p.sizes.map(s => `<button class="sz ${view.size === s ? "on" : ""}" data-act="size" data-v="${esc(s)}">${esc(s)}</button>`).join("");
  const colors = (p.colors || []).map(c => `<button class="sw ${view.color === c.name ? "on" : ""}" data-act="color" data-v="${esc(c.name)}" style="--c:${esc(c.hex)}" aria-label="${esc(c.name)}"></button>`).join("");
  const sim = similar(p);
  const info = CFG.info || {};
  return `
  <div class="pwrap">
    <span class="pghost" aria-hidden="true">№${esc(p.name)}</span>
    <div class="gwrap">
      ${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}
      <button class="heart ${fav ? "on" : ""}" data-act="fav" data-id="${p.id}" aria-label="В избранное">${I.heart}</button>
      <div class="gal" id="gal">${slides}</div>
      ${n > 1 ? `<div class="cnt" id="cnt">${cur0 + 1} / ${n}</div>` : ""}
    </div>
  </div>
  ${n > 1 ? `<div class="dots" id="dots">${Array.from({ length: n }, (_, i) => `<i class="${i === cur0 ? "on" : ""}"></i>`).join("")}</div>` : ""}
  <h1 class="pname silver">№ ${esc(p.name)}</h1>
  <div class="ptype">${esc(p.category)}${p.tag ? " · " + esc(p.tag) : ""}</div>
  <div class="pprice silver">${money(p.price)}${p.oldPrice > p.price ? `<s>${money(p.oldPrice)}</s>` : ""}</div>
  ${p.desc ? `<p class="pdesc">${esc(p.desc)}</p>` : ""}
  ${colors ? `<div class="lbl"><span>Цвет<b id="cname">${esc(view.color || "")}</b></span></div><div class="opts">${colors}</div>` : ""}
  <div class="lbl"><span>Размер</span>${CFG.sizeGuide ? `<button data-act="sizeGuide">Таблица размеров</button>` : ""}</div>
  <div class="opts" id="szs">${sizes}</div>
  <div style="margin-top:28px">
    ${info.delivery ? `<details class="acc"><summary>Доставка</summary><p>${esc(info.delivery)}</p></details>` : ""}
    ${info.returns ? `<details class="acc"><summary>Возврат и обмен</summary><p>${esc(info.returns)}</p></details>` : ""}
  </div>
  ${sim.length ? `<div class="lbl" style="margin-top:30px"><span>Похожие</span></div>
  <div class="rowh">${sim.map(x => `<div class="mini" data-act="open" data-id="${x.id}">${phHtml(x, 0)}<div class="nm silver">№ ${esc(x.name)}</div><div class="pr">${money(x.price)}</div></div>`).join("")}</div>` : ""}`;
}

function afterProduct() {
  const g = $("#gal");
  if (g) {
    g.scrollLeft = (view.photo || 0) * g.clientWidth;
    g.addEventListener("scroll", () => {
      const i = Math.round(g.scrollLeft / (g.clientWidth || 1)) || 0;
      if (i === (view.photo || 0)) return;
      view.photo = i;
      $$("#dots i").forEach((d, k) => d.classList.toggle("on", k === i));
      const c = $("#cnt"); if (c) c.textContent = (i + 1) + " / " + $$("#gal .ph").length;
      hap.sel();
    }, { passive: true });
  }
  syncProductMain();
}

function syncProductMain() {
  const p = prod(view.id);
  if (view.added) setMain("Открыть корзину", () => go({ name: "cart" }));
  else if (!view.size) setMain("Выберите размер", () => {
    shake($("#szs")); hap.warn(); toast("Выберите размер");
    const el = $("#szs"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "smooth" });
  });
  else setMain("В корзину · " + money(p.price), addToCart);
}

function addToCart() {
  const p = prod(view.id);
  const it = { id: p.id, size: view.size, color: view.color || "", qty: 1 };
  const ex = S.cart.find(i => keyOf(i) === keyOf(it));
  if (ex) ex.qty = Math.min(ex.qty + 1, 20); else S.cart.push(it);
  store("cart", S.cart);
  hap.ok();
  fly($("#gal"));
  view.added = true;
  syncProductMain();
  chrome();
  toast("В корзине");
}

function viewCart() {
  if (!S.cart.length) return `<div class="empty"><span class="emk"><img src="emb_white.svg" alt=""></span><b>Пока пусто</b><div>Фаза 01 уже вышла. Там есть что выбрать.</div></div>`;
  const c = calc(null);
  const items = S.cart.map(i => {
    const p = prod(i.id), k = esc(keyOf(i));
    return `<div class="it glass">
      <button class="rm" data-act="del" data-k="${k}" aria-label="Удалить">×</button>
      <div data-act="open" data-id="${p.id}">${phHtml(p, 0)}</div>
      <div class="inf">
        <div class="nm silver">№ ${esc(p.name)}</div>
        <div class="sub">${esc(i.size)}${i.color ? " · " + esc(i.color) : ""}</div>
        <div class="row">
          <div class="qty"><button data-act="minus" data-k="${k}">−</button><span>${i.qty}</span><button data-act="plus" data-k="${k}">+</button></div>
          <b>${money(p.price * i.qty)}</b>
        </div>
      </div></div>`;
  }).join("");
  let ship = "";
  if (c.thr > 0) {
    const left = c.thr - c.sub;
    ship = `<div class="ship glass">${left > 0 ? `До бесплатной доставки — <b>${money(left)}</b>` : `<b>Доставка за наш счёт.</b>`}
      <div class="bar"><i data-w="${Math.min(100, Math.round(c.sub / c.thr * 100))}"></i></div></div>`;
  }
  const pr = c.promo;
  const promoBox = pr
    ? `<div class="pchip"><div><b>${esc(pr.label || "Промокод")} ${pr.percent > 0 ? "+" : "−"}${Math.abs(pr.percent)}%</b><small>${esc(pr.note || "«" + pr.code + "»")}</small></div><button data-act="promoOff" aria-label="Убрать промокод">×</button></div>`
    : `<div class="promo"><input class="inp" id="promo" placeholder="Промокод" autocomplete="off" autocapitalize="off"><button class="btn2" data-act="promoOn">Применить</button></div>`;
  return `<h2 class="h2">Корзина</h2>${ship}${items}${promoBox}
  <div class="sum glass">
    <div class="ln"><span>Товары (${cartCount()})</span><span>${money(c.goods)}</span></div>
    ${c.promoLabel ? `<div class="ln"><span>${esc(c.promoLabel)}</span><span class="g">${signed(c.adj)}</span></div>` : ""}
    <div class="ln"><span>Доставка</span><span>на следующем шаге</span></div>
    <div class="ln t"><span>Сумма заказа</span><span>${money(c.sub)}</span></div>
  </div>`;
}
function afterCart() {
  requestAnimationFrame(() => requestAnimationFrame(() => $$(".bar i").forEach(i => { i.style.width = i.dataset.w + "%"; })));
  if (S.cart.length) setMain("Оформить заказ · " + money(calc(null).sub), () => go({ name: "checkout" }));
  else setMain("В каталог", () => go({ name: "home" }, { reset: true }));
}

function optHtml(d) {
  const r = calc(d.id);
  return `<button class="opt glass" data-act="delivery" data-id="${esc(d.id)}"><span class="rd"></span><div>${esc(d.name)}<small>${esc(d.note || "")}</small></div><em>${r.ship === 0 ? "Бесплатно" : money(r.ship)}</em></button>`;
}
function summaryHtml(c) {
  return `<div class="ln"><span>Товары (${cartCount()})</span><span>${money(c.goods)}</span></div>
    ${c.promoLabel ? `<div class="ln"><span>${esc(c.promoLabel)}</span><span class="g">${signed(c.adj)}</span></div>` : ""}
    <div class="ln"><span>Доставка${c.dl ? " · " + esc(c.dl.name) : ""}</span><span>${c.ship === 0 ? "Бесплатно" : money(c.ship)}</span></div>
    <div class="ln t"><span>Итого</span><span>${money(c.total)}</span></div>`;
}
function viewCheckout() {
  if (!(CFG.delivery || []).some(d => d.id === S.delivery)) S.delivery = CFG.delivery[0].id;
  const f = S.form;
  return `
  ${!IN_TG && !PREVIEW ? `<div class="notg">Чтобы оформить заказ, откройте магазин в Telegram.</div>` : ""}
  <h2 class="h2">Оформление</h2>
  <div class="sec" style="margin-top:4px">Контакты</div>
  <div class="field"><input class="inp" id="f_name" data-f="name" placeholder="Имя" value="${esc(f.name)}" autocomplete="name"></div>
  <div class="field"><input class="inp" id="f_phone" data-f="phone" type="tel" inputmode="tel" placeholder="Телефон" value="${esc(f.phone)}" autocomplete="tel"></div>
  <div class="sec">Доставка</div>
  <div id="opts">${CFG.delivery.map(optHtml).join("")}</div>
  <div class="field" id="addrBox"><textarea class="inp" id="f_address" data-f="address" rows="3" placeholder="Город, улица, дом, квартира">${esc(f.address)}</textarea></div>
  <div class="field"><textarea class="inp" id="f_comment" data-f="comment" rows="2" placeholder="Комментарий к заказу (необязательно)">${esc(f.comment)}</textarea></div>
  <div class="sec">Итого</div>
  <div class="sum glass" id="sumBox"></div>
  <p class="note">Оплата после подтверждения. Напишем — договоримся.</p>`;
}
function syncCheckout() {
  const c = calc(S.delivery);
  $("#addrBox").style.display = (c.dl && c.dl.needAddress) ? "" : "none";
  $("#sumBox").innerHTML = summaryHtml(c);
  $$(".opt").forEach(b => b.classList.toggle("on", b.dataset.id === S.delivery));
  setMain("Подтвердить заказ · " + money(c.total), submit);
}

let sending = false;
async function submit() {
  if (sending) return;
  const c = calc(S.delivery), f = S.form;
  const bad = [];
  if (f.name.trim().length < 2) bad.push("f_name");
  if (f.phone.replace(/\D/g, "").length < 10) bad.push("f_phone");
  if (c.dl.needAddress && f.address.trim().length < 5) bad.push("f_address");
  if (bad.length) {
    bad.forEach(id => { const el = $("#" + id); el.classList.add("err"); shake(el); });
    const first = $("#" + bad[0]); if (first.scrollIntoView) first.scrollIntoView({ block: "center", behavior: "smooth" });
    hap.warn(); toast("Проверьте выделенные поля");
    return;
  }
  if (!IN_TG && !PREVIEW) { hap.warn(); toast("Откройте магазин в Telegram, чтобы оформить заказ"); return; }
  sending = true; progress(true);
  try {
    let res;
    if (IN_TG) {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          initData: TG.initData,
          items: S.cart.map(i => ({ id: i.id, size: i.size, color: i.color, qty: i.qty })),
          customer: f, delivery: S.delivery,
          promo: srActive() ? "восход" : (S.promo || ""),
          sunrise: SR.rise || 0, lat: SR.lat, lon: SR.lon
        })
      });
      res = await r.json();
      if (!r.ok || !res.ok) throw new Error(res.error || "ошибка сервера");
    } else {
      res = { ok: true, orderId: "PREV01", total: c.total };   // только для ?preview=1
    }
    store("form", f); store("delivery", S.delivery);
    const done = { name: "done", id: res.orderId, total: res.total, count: cartCount() };
    S.cart = []; S.promo = ""; store("cart", S.cart); store("promo", "");
    go(done, { reset: true });
  } catch (e) {
    hap.warn(); notify("Заказ не ушёл: " + e.message);
  } finally {
    sending = false; progress(false);
  }
}

function viewDone() {
  return `<div class="tkt">
    <span class="tktm"><img src="emb_white.svg" alt="" onerror="this.remove()"></span>
    <span class="stamp">Принято</span>
    <div class="num">№ ${esc(view.id)}</div>
    <div class="mu">${view.count} ${plural(view.count)} · ${money(view.total)}</div>
    <div class="perf"></div>
    <p class="pay">${esc(CFG.payText || "Скоро свяжемся.")}</p>
  </div>
  <p class="thx">Первый шаг сделан.</p>`;
}

const VIEWS = {
  home: [viewHome, () => {
    clearInterval(cdTimer);
    srClock();
    cdTimer = setInterval(srClock, 1000);
    S.cart.length ? setMain("Корзина · " + money(calc(null).sub), () => go({ name: "cart" })) : setMain("");
  }],
  product: [viewProduct, afterProduct],
  cart: [viewCart, afterCart],
  checkout: [viewCheckout, syncCheckout],
  done: [viewDone, () => { hap.ok(); setMain("Закрыть", () => IN_TG ? safe(() => TG.close()) : go({ name: "home" }, { reset: true })); }]
};

function render(anim = true) {
  clearInterval(cdTimer);
  const [html, after] = VIEWS[view.name];
  app.innerHTML = `<div class="view${anim ? "" : " na"}">${html()}</div>`;
  chrome();
  after();
}

// ---------- действия ----------
function cartChanged() { store("cart", S.cart); hap.tap(); render(false); }
function toggleFav(id) {
  const i = S.fav.indexOf(id);
  i >= 0 ? S.fav.splice(i, 1) : S.fav.push(id);
  store("fav", S.fav); hap.tap();
  const on = S.fav.includes(id);
  $$(`.heart[data-id="${id}"]`).forEach(h => h.classList.toggle("on", on));
  if (view.name === "home" && S.favOnly && !on) $("#grid").innerHTML = gridHtml();
  if (on) toast("В избранном");
}
const A = {
  open: el => { closeSheet(); openProduct(+el.dataset.id); },
  fav: el => toggleFav(+el.dataset.id),
  back: () => back(),
  logo: () => { if (view.name !== "home") go({ name: "home" }, { reset: true }); },
  bag: () => { if (view.name !== "cart") go({ name: "cart" }); },
  favFilter: () => {
    S.favOnly = !S.favOnly; hap.sel();
    if (view.name !== "home") go({ name: "home" }, { reset: true });
    else { $("#grid").innerHTML = gridHtml(); chrome(); }
  },
  cat: el => { S.cat = el.dataset.v; hap.sel(); $("#chips").innerHTML = chipsHtml(); $("#grid").innerHTML = gridHtml(); },
  toGrid: () => { const s = $("#grid"); if (s && s.scrollIntoView) s.scrollIntoView({ behavior: "smooth", block: "start" }); },
  size: el => {
    view.size = el.dataset.v; view.added = false; hap.sel();
    $$('[data-act="size"]').forEach(b => b.classList.toggle("on", b === el));
    syncProductMain();
  },
  color: el => {
    view.color = el.dataset.v; view.added = false; hap.sel();
    $$('[data-act="color"]').forEach(b => b.classList.toggle("on", b === el));
    $("#cname").textContent = view.color;
    syncProductMain();
  },
  sizeGuide: () => {
    const g = CFG.sizeGuide;
    openSheet(`<h3 class="sh">Таблица размеров</h3>
      <table class="sg"><tr>${g.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>
      ${g.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>
      <p class="mu sm">${esc(g.note || "")}</p>`);
  },
  closeSheet: () => closeSheet(),
  plus: el => { const i = S.cart.find(x => keyOf(x) === el.dataset.k); if (i) i.qty = Math.min(i.qty + 1, 20); cartChanged(); },
  minus: el => {
    const i = S.cart.find(x => keyOf(x) === el.dataset.k);
    if (i) { i.qty--; if (i.qty <= 0) S.cart = S.cart.filter(x => x !== i); }
    cartChanged();
  },
  del: el => { S.cart = S.cart.filter(x => keyOf(x) !== el.dataset.k); cartChanged(); },
  promoOn: () => {
    const inp = $("#promo"), p = findPromo(inp.value);
    if (!p) { inp.classList.add("err"); shake(inp); hap.warn(); toast("Промокод не найден"); return; }
    S.promo = p.code; store("promo", S.promo);
    hap.ok(); render(false);
    toast(p.toast || "Промокод применён", 3600);
  },
  promoOff: () => { S.promo = ""; store("promo", ""); hap.tap(); render(false); },
  delivery: el => { S.delivery = el.dataset.id; hap.sel(); syncCheckout(); },
  reload: () => location.reload()
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.f) { S.form[t.dataset.f] = t.value; t.classList.remove("err"); }
  else if (t.id === "promo") t.classList.remove("err");
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "promo") A.promoOn();
});

// ---------- заставка и запуск ----------
function startSplash() {
  const sp = $("#splash");
  let seen = false;
  safe(() => { seen = !!sessionStorage.getItem("sp"); sessionStorage.setItem("sp", "1"); });
  if (seen || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) { sp.remove(); return; }
  const slog = $("#splog");
  if (!slog) {
    $("#spw").style.display = "";
    $("#spw").innerHTML = Array.from(String(CFG.shopName || "")).map((ch, i) => `<span style="--i:${i}">${ch === " " ? "&nbsp;" : esc(ch)}</span>`).join("");
  }
  const spt = $("#spt");
  if (CFG.tagline) spt.textContent = CFG.tagline; else spt.remove();
  const off = () => { sp.classList.add("hide"); setTimeout(() => sp.remove(), 700); };
  sp.addEventListener("click", off);
  setTimeout(off, 1700);
}

async function boot() {
  try {
    const r = await fetch("products.json?t=" + Date.now());
    const d = await r.json();
    CFG = d.settings || {};
    PRODUCTS = d.products || [];
    if (!PRODUCTS.length) throw new Error("empty");
  } catch (e) {
    $("#splash").remove();
    app.innerHTML = `<div class="empty"><span class="emk"><img src="emb_white.svg" alt=""></span><b>Ничего не загрузилось</b><div>Проверьте соединение.</div><button class="cta" data-act="reload">Обновить</button></div>`;
    return;
  }
  if (!CFG.delivery || !CFG.delivery.length) CFG.delivery = [{ id: "pickup", name: "Самовывоз", note: "", price: 0, needAddress: false }];
  document.title = CFG.shopName || "Магазин";
  const bl = $("#brandLogo");
  if (bl) bl.alt = CFG.shopName || "магазин";
  // убрать из корзины то, чего больше нет в каталоге
  S.cart = S.cart.filter(i => {
    const p = prod(i.id);
    return p && p.sizes.includes(i.size) && (!(p.colors || []).length || p.colors.some(c => c.name === i.color));
  }).map(i => ({ id: i.id, size: i.size, color: i.color || "", qty: Math.min(Math.max(i.qty | 0, 1), 20) }));
  S.fav = S.fav.filter(id => prod(id));
  if (S.promo && !findPromo(S.promo)) S.promo = "";
  render();
  startSplash();
}
boot();
})();
</script>
</body>
</html>
