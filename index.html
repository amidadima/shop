<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Магазин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0b0c; --s1:#141416; --s2:#1c1c1f; --line:rgba(255,255,255,.09);
  --tx:#f4efe6; --mu:#8f8b83; --gold:#cdb083; --gold2:#ead8b2; --ink:#0b0b0c; --red:#e5645b;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.serif{font-family:var(--serif)}
.mu{color:var(--mu)} .sm{font-size:12px}

/* ---------- шапка ---------- */
#hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;
  background:rgba(11,11,12,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hl{display:flex;align-items:center;gap:4px}.hr{display:flex;gap:2px}
.brand{font:600 21px/1 var(--serif);letter-spacing:.22em;text-transform:uppercase;user-select:none;cursor:pointer}
.brand small{display:block;font:500 8px/1 var(--sans);letter-spacing:.34em;color:var(--gold);margin-top:5px}
.ic{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.ic svg{width:22px;height:22px}
.ic.act svg{fill:var(--gold);stroke:var(--gold)}
.ic .badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--gold);color:var(--ink);
  font:600 10px/17px var(--sans);text-align:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ic .badge.on{transform:scale(1)}
.ic.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.25)}}

#app{padding:0 16px 120px;min-height:80vh}
.view{animation:viewIn .4s cubic-bezier(.2,.8,.2,1)}
.view.na{animation:none}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}

/* ---------- главная ---------- */
.hero{position:relative;margin-top:14px;padding:30px 22px 24px;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,#1b1a18,#0f0f10 60%);border:1px solid var(--line)}
.hero::before{content:"";position:absolute;width:340px;height:340px;right:-120px;top:-140px;background:radial-gradient(circle,rgba(205,176,131,.38),transparent 65%);animation:float 9s ease-in-out infinite}
.hero::after{content:"";position:absolute;width:260px;height:260px;left:-120px;bottom:-150px;background:radial-gradient(circle,rgba(205,176,131,.16),transparent 65%);animation:float 12s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(-18px,14px) scale(1.08)}}
.hero>*{position:relative;z-index:1}
.eyebrow{font:500 10px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.hero h1{font:500 46px/1 var(--serif);margin:14px 0 12px;letter-spacing:-.01em}
.hero h1 em{font-style:italic;background:linear-gradient(120deg,var(--gold2),var(--gold) 55%,#a98650);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:4px}
.hero p{color:var(--mu);max-width:270px}
.cdl{font-size:11px;color:var(--mu);margin-top:18px;letter-spacing:.06em}
.cd{display:flex;gap:8px;margin:8px 0 2px}
.cd div{min-width:54px;padding:9px 6px 8px;text-align:center;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.cd b{display:block;font:500 22px/1 var(--serif);font-variant-numeric:tabular-nums;margin-bottom:4px}
.cd span{font:500 8px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.cta{margin-top:20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:30px;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--ink);font-weight:600;font-size:13px;letter-spacing:.04em;transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta svg{width:16px;height:16px;stroke-width:2}
.cta.wide{width:100%}

.tick{margin:16px -16px 0;overflow:hidden;border-block:1px solid var(--line);padding:11px 0;white-space:nowrap}
.tick div{display:inline-block;animation:mq 30s linear infinite;font:500 10px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--mu)}
.tick span{margin:0 18px}
.tick span::after{content:"✦";margin-left:36px;color:var(--gold)}
@keyframes mq{to{transform:translateX(-50%)}}

.rl-b{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:16px;padding:16px 18px;border-radius:var(--r);
  background:var(--s1);border:1px solid var(--line);text-align:left;transition:transform .15s}
.rl-b:active{transform:scale(.985)}
.rl-b b{display:block;font:600 21px/1.1 var(--serif)}
.rl-b span{font-size:12px;color:var(--mu)}
.rl-b i{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--gold);color:var(--gold);flex:none}
.rl-b i svg{width:22px;height:22px}

.search{position:relative;margin-top:18px;scroll-margin-top:70px}
.search input{width:100%;padding:13px 16px 13px 44px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--tx);font:inherit;outline:none;transition:border-color .2s}
.search input:focus{border-color:rgba(205,176,131,.5)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:30px;border:1px solid var(--line);color:var(--mu);font-size:13px;transition:.2s}
.chip.on{background:var(--tx);color:var(--ink);border-color:var(--tx);font-weight:500}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;margin-top:18px}
.card{position:relative;animation:rise .55s both;animation-delay:calc(var(--i,0)*50ms);cursor:pointer}
.card:active .ph{transform:scale(.985)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.ph{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:linear-gradient(160deg,#242427,#141416);display:grid;place-items:center;transition:transform .2s}
.ph::before{content:attr(data-m);font:italic 500 64px/1 var(--serif);color:rgba(205,176,131,.22)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .nm{margin-top:10px;font-size:14px;line-height:1.3}
.pr{font-weight:600;margin-top:3px}
.pr s{color:var(--mu);font-weight:400;margin-left:6px;font-size:13px}
.tag{position:absolute;top:10px;left:10px;z-index:2;padding:5px 9px;border-radius:20px;background:rgba(11,11,12,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(205,176,131,.5);color:var(--gold2);font:500 9px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase}
.heart{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(11,11,12,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.heart svg{width:17px;height:17px;stroke:var(--tx);transition:.25s}
.heart.on svg{fill:var(--gold);stroke:var(--gold);animation:pop .4s}
@keyframes pop{50%{transform:scale(1.35)}}

.empty{text-align:center;padding:64px 20px;color:var(--mu)}
.empty svg{width:60px;height:60px;color:var(--gold);stroke-width:1.1;margin:0 auto 16px}
.empty b{display:block;font:500 30px/1.1 var(--serif);color:var(--tx);margin-bottom:6px}
.sk{border-radius:var(--r);aspect-ratio:4/5;background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%);background-size:200% 100%;animation:shim 1.4s infinite}
@keyframes shim{to{background-position:-200% 0}}

/* ---------- товар ---------- */
.gwrap{position:relative;margin-top:12px;border-radius:24px;overflow:hidden}
.gwrap .heart{top:14px;right:14px}
.gwrap .tag{top:18px;left:16px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .ph{flex:none;width:100%;border-radius:0;scroll-snap-align:center}
.cnt{position:absolute;right:14px;bottom:14px;z-index:2;padding:6px 11px;border-radius:20px;background:rgba(11,11,12,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:500 11px/1 var(--sans);letter-spacing:.1em}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--mu);opacity:.4;transition:.3s}
.dots i.on{width:20px;background:var(--gold);opacity:1}
.pname{font:500 36px/1.03 var(--serif);margin-top:16px}
.pprice{font:600 22px/1 var(--sans);margin-top:12px}
.pprice s{font-weight:400;font-size:15px;color:var(--mu);margin-left:8px}
.pdesc{color:var(--mu);margin-top:12px}
.lbl{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px;font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.lbl b{color:var(--tx);font-weight:500;letter-spacing:.04em;text-transform:none;font-size:13px;margin-left:8px}
.lbl button{color:var(--gold);letter-spacing:.04em;text-transform:none;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:52px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--s1);font-weight:500;transition:.2s}
.sz.on{background:var(--tx);color:var(--ink);border-color:var(--tx)}
.sw{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--c);position:relative;margin:5px}
.sw.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--gold)}
.acc{border-top:1px solid var(--line)}
.acc:last-of-type{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:500;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--gold);font-size:22px;line-height:1;transition:.2s}
.acc[open] summary::after{transform:rotate(45deg)}
.acc p{padding:0 0 16px;color:var(--mu)}
.rowh{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.rowh::-webkit-scrollbar{display:none}
.mini{flex:none;width:132px;cursor:pointer}
.mini .nm{font-size:13px;margin-top:8px;line-height:1.25}
.mini .pr{font-size:13px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- корзина и оформление ---------- */
.h2{font:500 36px/1 var(--serif);margin:24px 0 16px}
.it{position:relative;display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center;padding:12px;margin-bottom:10px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line)}
.it .ph{border-radius:12px;aspect-ratio:3/4}
.it .ph::before{font-size:34px}
.it .inf{min-width:0;padding-right:20px}
.it .nm{font-size:14px;line-height:1.25}
.it .sub{font-size:12px;color:var(--mu);margin-top:2px}
.it .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.rm{position:absolute;top:6px;right:8px;width:28px;height:28px;font-size:22px;line-height:1;color:var(--mu)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:30px;padding:2px}
.qty button{width:30px;height:30px;border-radius:50%;font-size:18px}
.qty span{min-width:24px;text-align:center;font-weight:500;font-size:14px}
.ship{padding:14px 16px;margin-bottom:12px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);font-size:13px;color:var(--mu)}
.ship b{color:var(--gold2);font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.promo{display:flex;gap:8px;margin:12px 0}
.inp{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--tx);font:inherit;outline:none;transition:border-color .2s}
.inp:focus{border-color:rgba(205,176,131,.55)}
.inp.err{border-color:var(--red)}
textarea.inp{resize:none;display:block}
.btn2{padding:0 18px;border-radius:14px;border:1px solid var(--gold);color:var(--gold2);font-weight:500;white-space:nowrap}
.pchip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;margin:12px 0;border-radius:14px;border:1px dashed var(--gold);background:rgba(205,176,131,.07)}
.pchip small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.pchip button{font-size:24px;color:var(--mu);line-height:1}
.sum{padding:16px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line)}
.ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;color:var(--mu)}
.ln.t{color:var(--tx);font-weight:600;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.ln .g{color:var(--gold2)}
.sec{margin:24px 0 10px;font:500 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.field{margin-bottom:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line);background:var(--s1);transition:.2s}
.opt .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mu);flex:none;position:relative;transition:.2s}
.opt.on{border-color:var(--gold);background:rgba(205,176,131,.07)}
.opt.on .rd{border-color:var(--gold)}
.opt.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold)}
.opt div{flex:1}
.opt small{display:block;color:var(--mu);font-size:12px}
.opt em{font-style:normal;font-weight:600}
.note{color:var(--mu);font-size:12px;margin-top:12px;text-align:center}
.notg{padding:14px 16px;margin-top:16px;border:1px solid var(--red);border-radius:14px;color:var(--red);font-size:13px}

/* ---------- заказ принят ---------- */
.tkt{position:relative;margin-top:26px;padding:34px 22px 28px;border-radius:22px;background:linear-gradient(170deg,#1d1c1a,#131314);border:1px solid var(--line);text-align:center;overflow:hidden}
.stamp{display:inline-block;padding:7px 15px;border:2px solid var(--gold);border-radius:8px;color:var(--gold2);font:600 12px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;
  transform:rotate(-6deg) scale(2.2);opacity:0;animation:stamp .5s .3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{to{transform:rotate(-6deg) scale(1);opacity:1}}
.num{font:500 46px/1 var(--serif);margin:20px 0 6px;letter-spacing:.04em}
.perf{border-top:2px dashed var(--line);margin:24px -22px 20px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-12px}.perf::after{right:-12px}
.pay{white-space:pre-line;color:var(--mu)}
.thx{text-align:center;font:italic 500 24px/1.2 var(--serif);color:var(--mu);margin:26px 0}

/* ---------- слои ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;padding:22px 18px 34px;border-radius:26px 26px 0 0;background:var(--s1);border-top:1px solid var(--line);animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 16px}
.sh{font:500 30px/1.1 var(--serif);margin-bottom:10px}
table.sg{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:12px}
.sg th,.sg td{padding:11px 6px;text-align:center;border-bottom:1px solid var(--line)}
.sg th{color:var(--gold);font:500 10px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.code{font:500 24px/1.2 var(--serif);text-align:center;padding:18px;border:1px dashed var(--gold);border-radius:14px;margin:14px 0;color:var(--gold2)}
.rl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px}
.rl small{letter-spacing:.3em;font-size:10px;text-transform:uppercase;color:var(--gold)}
.rl .n{font:500 40px/1.1 var(--serif);margin:18px 0 10px;min-height:90px;display:grid;place-items:center;transition:transform .3s,color .3s}
.rl .n.win{color:var(--gold2);transform:scale(1.07)}
.fly{position:fixed;width:24px;height:24px;border-radius:50%;background:var(--gold);z-index:80;pointer-events:none;box-shadow:0 0 22px rgba(205,176,131,.8)}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);max-width:88vw;padding:12px 18px;border-radius:30px;background:rgba(244,239,230,.97);color:var(--ink);
  font-size:13px;font-weight:500;text-align:center;opacity:0;pointer-events:none;transition:.3s;z-index:90}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fb{position:fixed;left:16px;right:16px;bottom:16px;z-index:30;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--ink);font-weight:600;text-align:center;transform:translateY(150%);transition:transform .3s}
#fb.show{transform:none}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .6s,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash .w{display:flex;justify-content:center;font:500 30px/1 var(--serif);letter-spacing:.28em;text-transform:uppercase}
#splash .w span{opacity:0;transform:translateY(12px);animation:ltr .6s forwards;animation-delay:calc(var(--i)*60ms)}
#splash .tg{margin-top:16px;font:500 10px/1 var(--sans);letter-spacing:.4em;color:var(--gold);text-transform:uppercase;opacity:0;animation:ltr .6s .8s forwards}
@keyframes ltr{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="splash"><div><div class="w" id="spw"></div><div class="tg" id="spt"></div></div></div>

<header id="hd">
  <div class="hl">
    <button class="ic" id="hbk" data-act="back" style="display:none" aria-label="Назад"></button>
    <div class="brand" data-act="logo"><span id="brandName">&nbsp;</span><small id="brandTag"></small></div>
  </div>
  <div class="hr">
    <button class="ic" id="favBtn" data-act="favFilter" aria-label="Избранное"></button>
    <button class="ic" id="bagBtn" data-act="bag" aria-label="Корзина"></button>
  </div>
</header>

<div id="app">
  <div class="grid" style="margin-top:18px"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</div>

<button id="fb" type="button"></button>
<div id="toast"></div>

<script>
(() => {
"use strict";

// ===== НАСТРОЙКА: адрес вашего Cloudflare Worker =====
const API_URL = "https://shop-orders.ddggoff.workers.dev/";
// =====================================================

const TG = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(TG && TG.initData);

// ---------- утилиты ----------
const prod = id => PRODUCTS.find(p => p.id === id);
const cur = () => CFG.currency || "₽";
const money = n => Number(n).toLocaleString("ru-RU") + "\u00A0" + cur();
const photos = p => (p.imgs && p.imgs.length) ? p.imgs : (p.img ? [p.img] : []);
const keyOf = i => i.id + "|" + i.size + "|" + (i.color || "");
const cartCount = () => S.cart.reduce((s, i) => s + i.qty, 0);
const goodsSum = () => S.cart.reduce((s, i) => s + prod(i.id).price * i.qty, 0);
const initial = p => ((String(p.name).match(/[A-Za-zА-Яа-яЁё0-9]/) || ["•"])[0]).toUpperCase();
const phHtml = (p, i = 0) => {
  const u = photos(p)[i];
  return `<div class="ph" data-m="${esc(initial(p))}">${u ? `<img src="${esc(u)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ""}</div>`;
};
const plural = n => { const a = n % 10, b = n % 100; return (a === 1 && b !== 11) ? "товар" : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? "товара" : "товаров"; };
const findPromo = code => code ? (CFG.promos || []).find(p => norm(p.code) === norm(code)) : null;
const signed = n => (n > 0 ? "+" : "−") + money(Math.abs(n));

// Расчёт суммы. Та же формула считается на сервере (worker.js)
function calc(deliveryId) {
  const goods = goodsSum();
  const promo = findPromo(S.promo);
  const adj = promo ? Math.round(goods * promo.percent / 100) : 0;
  const sub = goods + adj;
  const dl = (CFG.delivery || []).find(d => d.id === deliveryId) || null;
  const thr = Number(CFG.freeShipFrom) || 0;
  const free = thr > 0 && sub >= thr;
  const ship = dl ? (free ? 0 : dl.price) : 0;
  return { goods, promo, adj, sub, dl, free, ship, total: sub + ship, thr };
}

let toastT;
function toast(m, ms = 2400) {
  const t = $("#toast");
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(toastT);

}
function shake(el) { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

function confetti() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:150";
  document.body.appendChild(cv);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const ctx = cv.getContext && cv.getContext("2d");
  if (!ctx) { cv.remove(); return; }
  ctx.scale(dpr, dpr);
  const cols = ["#ead8b2", "#cdb083", "#f4efe6", "#a98650"];
  const ps = Array.from({ length: 110 }, () => ({
    x: innerWidth / 2, y: innerHeight * 0.38,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4,
    w: 5 + Math.random() * 6, h: 3 + Math.random() * 5,
    r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: cols[Math.random() * cols.length | 0]
  }));
  const t0 = performance.now();
  (function frame(t) {
    const k = t - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += .35; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - k / 2600);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    k < 2600 ? requestAnimationFrame(frame) : cv.remove();
  })(t0);
}

function fly(fromEl) {
  const bag = $("#bagBtn");
  if (!fromEl || !bag) return;
  const a = fromEl.getBoundingClientRect(), b = bag.getBoundingClientRect();
  const d = document.createElement("div");
  d.className = "fly";
  const sx = a.left + a.width / 2, sy = a.top + Math.min(a.height / 2, 160);
  d.style.left = (sx - 12) + "px"; d.style.top = (sy - 12) + "px";
  document.body.appendChild(d);
  const done = () => { d.remove(); bag.classList.remove("bump"); void bag.offsetWidth; bag.classList.add("bump"); };
  if (!d.animate) return done();
  const an = d.animate([
    { transform: "translate(0,0) scale(1)", opacity: 1 },
    { transform: `translate(${b.left + b.width / 2 - sx}px,${b.top + b.height / 2 - sy}px) scale(.3)`, opacity: .5 }
  ], { duration: 650, easing: "cubic-bezier(.5,-.2,.7,1)" });
  an.onfinish = done;
}

let view = { name: "home" };
const stack = [];
function go(v, opt = {}) {
  view.scroll = window.scrollY;
  if (opt.reset) stack.length = 0; else stack.push(view);
  view = v;
  render();
  window.scrollTo(0, 0);
}
function back() {
  if (sheet) { closeSheet(); return; }
  view = stack.pop() || { name: "home" };
  render(false);
  window.scrollTo(0, view.scroll || 0);
}

let cdTimer;
const dropLeft = () => { const t = Date.parse(CFG.dropDate || ""); if (!t) return null; const ms = t - Date.now(); return ms > 0 ? ms : null; };
function cdHtml(ms) {
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const cell = (n, l) => `<div><b>${String(n).padStart(2, "0")}</b><span>${l}</span></div>`;
  return cell(d, "дн") + cell(h, "час") + cell(m, "мин") + cell(x, "сек");
}

function filtered() {
  const q = norm(S.q);
  return PRODUCTS.filter(p =>
    (S.cat === "Все" || p.category === S.cat) &&
    (!S.favOnly || S.fav.includes(p.id)) &&
    (!q || norm(p.name + " " + (p.category || "")).includes(q)));
}
function cardHtml(p, i) {
  const fav = S.fav.includes(p.id);
  return `<div class="card" data-act="open" data-id="${p.id}" style="--i:${i}">
    ${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}
    <button class="heart ${fav ? "on" : ""}" data-act="fav" data-id="${p.id}" aria-label="В избранное">${I.heart}</button>
    ${phHtml(p, 0)}
    <div class="nm">${esc(p.name)}</div>
    <div class="pr">${money(p.price)}${p.oldPrice > p.price ? `<s>${money(p.oldPrice)}</s>` : ""}</div>
  </div>`;
}
function gridHtml() {
  const list = filtered();
  if (!list.length) {
    const msg = S.favOnly ? ["Избранное пока пусто", "Нажмите на сердечко у вещи, которая понравилась"] : ["Ничего не нашли", "Попробуйте другой запрос или категорию"];
    return `<div class="empty" style="grid-column:1/-1">${I.search}<b>${msg[0]}</b><div>${msg[1]}</div></div>`;
  }
  return list.map(cardHtml).join("");
}
function chipsHtml() {
  const cats = ["Все", ...new Set(PRODUCTS.map(p => p.category).filter(Boolean))];
  return cats.map(c => `<button class="chip ${S.cat === c ? "on" : ""}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join("");
}

function similar(p) {
  const same = PRODUCTS.filter(x => x.id !== p.id && x.category === p.category);
  const rest = PRODUCTS.filter(x => x.id !== p.id && x.category !== p.category);
  return same.concat(rest).slice(0, 6);
}

  const colors = (p.colors || []).map(c => `<button class="sw ${view.color === c.name ? "on" : ""}" data-act="color" data-v="${esc(c.name)}" style="--c:${esc(c.hex)}" aria-label="${esc(c.name)}"></button>`).join("");
  const sim = similar(p);

  return `
  <div class="gwrap">
    ${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}
    <button class="heart ${fav ? "on" : ""}" data-act="fav" data-id="${p.id}" aria-label="В избранное">${I.heart}</button>
    <div class="gal" id="gal">${slides}</div>

  <h1 class="pname">${esc(p.name)}</h1>
  <div class="pprice">${money(p.price)}${p.oldPrice > p.price ? `<s>${money(p.oldPrice)}</s>` : ""}</div>
  ${p.desc ? `<p class="pdesc">${esc(p.desc)}</p>` : ""}

  <div class="rowh">${sim.map(x => `<div class="mini" data-act="open" data-id="${x.id}">${phHtml(x, 0)}<div class="nm">${esc(x.name)}</div><div class="pr">${money(x.price)}</div></div>`).join("")}</div>` : ""}`;

function afterProduct() {
  const g = $("#gal");
  if (g) {
    g.scrollLeft = (view.photo || 0) * g.clientWidth;
    g.addEventListener("scroll", () => {
      const i = Math.round(g.scrollLeft / (g.clientWidth || 1)) || 0;
      if (i === (view.photo || 0)) return;
      view.photo = i;
      $$("#dots i").forEach((d, k) => d.classList.toggle("on", k === i));
      const c = $("#cnt"); if (c) c.textContent = (i + 1) + " / " + $$("#gal .ph").length;
      hap.sel();
    }, { passive: true });
  }
  syncProductMain();
}

function syncProductMain() {
  const p = prod(view.id);
  if (view.added) setMain("Открыть корзину", () => go({ name: "cart" }));
  else if (!view.size) setMain("Выберите размер", () => {
    shake($("#szs")); hap.warn(); toast("Выберите размер");
    const el = $("#szs"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "smooth" });
  });
  else setMain("В корзину · " + money(p.price), addToCart);
}

function addToCart() {
  const p = prod(view.id);
  const it = { id: p.id, size: view.size, color: view.color || "", qty: 1 };
  const ex = S.cart.find(i => keyOf(i) === keyOf(it));
  if (ex) ex.qty = Math.min(ex.qty + 1, 20); else S.cart.push(it);
  store("cart", S.cart);
  hap.ok();
  fly($("#gal"));
  view.added = true;
  syncProductMain();
  chrome();
  toast("Добавлено в корзину");
}

    <div class="ln t"><span>Итого</span><span>${money(c.total)}</span></div>`;
}
function viewCheckout() {
  if (!(CFG.delivery || []).some(d => d.id === S.delivery)) S.delivery = CFG.delivery[0].id;
  const f = S.form;
  return `
  ${!IN_TG && !PREVIEW ? `<div class="notg">Чтобы оформить заказ, откройте магазин в Telegram.</div>` : ""}
  <h2 class="h2">Оформление</h2>
  <div class="sec" style="margin-top:4px">Контакты</div>
  <div class="field"><input class="inp" id="f_name" data-f="name" placeholder="Имя" value="${esc(f.name)}" autocomplete="name"></div>
  <div class="field"><input class="inp" id="f_phone" data-f="phone" type="tel" inputmode="tel" placeholder="Телефон" value="${esc(f.phone)}" autocomplete="tel"></div>
  <div class="sec">Доставка</div>
  <div id="opts">${CFG.delivery.map(optHtml).join("")}</div>
  <div class="field" id="addrBox"><textarea class="inp" id="f_address" data-f="address" rows="3" placeholder="Город, улица, дом, квартира">${esc(f.address)}</textarea></div>
  <div class="field"><textarea class="inp" id="f_comment" data-f="comment" rows="2" placeholder="Комментарий к заказу (необязательно)">${esc(f.comment)}</textarea></div>
  <div class="sec">Итого</div>
  <div class="sum" id="sumBox"></div>
  <p class="note">Оплата после подтверждения: менеджер напишет вам в Telegram.</p>`;
}
function syncCheckout() {
  const c = calc(S.delivery);
  $("#addrBox").style.display = (c.dl && c.dl.needAddress) ? "" : "none";
  $("#sumBox").innerHTML = summaryHtml(c);
  $$(".opt").forEach(b => b.classList.toggle("on", b.dataset.id === S.delivery));
  setMain("Подтвердить заказ · " + money(c.total), submit);
}

let sending = false;
async function submit() {
  if (sending) return;
  const c = calc(S.delivery), f = S.form;
  const bad = [];
  if (f.name.trim().length < 2) bad.push("f_name");
  if (f.phone.replace(/\D/g, "").length < 10) bad.push("f_phone");
  if (c.dl.needAddress && f.address.trim().length < 5) bad.push("f_address");
  if (bad.length) {
    bad.forEach(id => { const el = $("#" + id); el.classList.add("err"); shake(el); });
    const first = $("#" + bad[0]); if (first.scrollIntoView) first.scrollIntoView({ block: "center", behavior: "smooth" });
    hap.warn(); toast("Проверьте выделенные поля");
    return;
  }
  if (!IN_TG && !PREVIEW) { hap.warn(); toast("Откройте магазин в Telegram, чтобы оформить заказ"); return; }
  sending = true; progress(true);
  try {
    let res;
    if (IN_TG) {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          initData: TG.initData,
          items: S.cart.map(i => ({ id: i.id, size: i.size, color: i.color, qty: i.qty })),
          customer: f, delivery: S.delivery, promo: S.promo || ""
        })
      });
      res = await r.json();
      if (!r.ok || !res.ok) throw new Error(res.error || "ошибка сервера");
    } else {
      res = { ok: true, orderId: "PREV01", total: c.total };   // только для ?preview=1
    }
    store("form", f); store("delivery", S.delivery);
    const done = { name: "done", id: res.orderId, total: res.total, count: cartCount() };
    S.cart = []; S.promo = ""; store("cart", S.cart); store("promo", "");
    go(done, { reset: true });
  } catch (e) {
    hap.warn(); notify("Не удалось отправить заказ: " + e.message);
  } finally {
    sending = false; progress(false);
  }
}

function viewDone() {
  return `<div class="tkt">
    <span class="stamp">Принят</span>
    <div class="num">№ ${esc(view.id)}</div>
    <div class="mu">${view.count} ${plural(view.count)} · ${money(view.total)}</div>
    <div class="perf"></div>
    <p class="pay">${esc(CFG.payText || "Мы скоро свяжемся с вами.")}</p>
  </div>
  <p class="thx">Спасибо, что с нами.</p>`;
}

const VIEWS = {
  home: [viewHome, () => {
    clearInterval(cdTimer);
    cdTimer = setInterval(() => {
      const el = $("#cd"), ms = dropLeft();
      if (!el || ms == null) { clearInterval(cdTimer); return; }
      el.innerHTML = cdHtml(ms);
    }, 1000);
    S.cart.length ? setMain("Корзина · " + money(calc(null).sub), () => go({ name: "cart" })) : setMain("");
  }],
  product: [viewProduct, afterProduct],
  cart: [viewCart, afterCart],
  checkout: [viewCheckout, syncCheckout],
  done: [viewDone, () => { confetti(); hap.ok(); setMain("Закрыть", () => IN_TG ? safe(() => TG.close()) : go({ name: "home" }, { reset: true })); }]
};

function render(anim = true) {
  clearInterval(cdTimer);
  const [html, after] = VIEWS[view.name];
  app.innerHTML = `<div class="view${anim ? "" : " na"}">${html()}</div>`;
  chrome();
  after();
}

// ---------- рулетка и пасхалка ----------
function roulette() {
  if (!PRODUCTS.length) return;
  closeSheet();
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="rl"><small>Стилист-рулетка</small><div class="n serif" id="rln">…</div><div class="mu" id="rlt">Подбираем образ</div></div>`;
  document.body.appendChild(ov);
  const pick = PRODUCTS[Math.random() * PRODUCTS.length | 0];
  const lines = ["Это ваше.", "Судьба одета.", "Брат, бери.", "Выглядит как решение."];
  let step = 0, delay = 70;
  (function tick() {
    step++;
    const last = step >= 16;
    const p = last ? pick : PRODUCTS[Math.random() * PRODUCTS.length | 0];
    $("#rln").textContent = p.name;
    hap.sel();
    if (!last) { delay *= 1.13; setTimeout(tick, delay); return; }
    $("#rln").classList.add("win");
    $("#rlt").textContent = lines[Math.random() * lines.length | 0];
    hap.ok();
    setTimeout(() => { ov.remove(); openProduct(pick.id); }, 1100);
  })();
}

function secret() {
  hap.ok(); confetti();
  const p = (CFG.promos || [])[0];
  openSheet(p
    ? `<div class="eyebrow" style="color:var(--gold)">Секретная комната</div>
       <h3 class="sh" style="margin-top:12px">Вы нашли пасхалку</h3>
       <p class="mu">Для тех, кто внимательно смотрит. Промокод:</p>
       <div class="code">${esc(p.code)}</div>
       <p class="mu sm">Спойлер: ${esc(p.spoiler || "условия смотрите в корзине")}</p>
       <button class="cta wide" data-act="usePromo">Применить</button>`
    : `<h3 class="sh">Секретов пока нет</h3><p class="mu">Но мы работаем над этим.</p>`);
}

// ---------- действия ----------
function cartChanged() { store("cart", S.cart); hap.tap(); render(false); }
function toggleFav(id) {
  const i = S.fav.indexOf(id);
  i >= 0 ? S.fav.splice(i, 1) : S.fav.push(id);
  store("fav", S.fav); hap.tap();
  const on = S.fav.includes(id);
  $$(`.heart[data-id="${id}"]`).forEach(h => h.classList.toggle("on", on));
  if (view.name === "home" && S.favOnly && !on) $("#grid").innerHTML = gridHtml();
  if (on) toast("В избранном");
}
let logoTaps = 0, logoT;
const A = {
  open: el => openProduct(+el.dataset.id),
  fav: el => toggleFav(+el.dataset.id),
  back: () => back(),
  logo: () => {
    logoTaps++; clearTimeout(logoT); logoT = setTimeout(() => { logoTaps = 0; }, 2200);
    if (logoTaps >= 5) { logoTaps = 0; secret(); return; }
    if (view.name !== "home") go({ name: "home" }, { reset: true });
  },
  bag: () => { if (view.name !== "cart") go({ name: "cart" }); },
  favFilter: () => {
    S.favOnly = !S.favOnly; hap.sel();
    if (view.name !== "home") go({ name: "home" }, { reset: true });
    else { $("#grid").innerHTML = gridHtml(); chrome(); }
  },
  cat: el => { S.cat = el.dataset.v; hap.sel(); $("#chips").innerHTML = chipsHtml(); $("#grid").innerHTML = gridHtml(); },
  toGrid: () => { const s = $(".search"); if (s && s.scrollIntoView) s.scrollIntoView({ behavior: "smooth", block: "start" }); },
  roulette,
  size: el => {
    view.size = el.dataset.v; view.added = false; hap.sel();
    $$('[data-act="size"]').forEach(b => b.classList.toggle("on", b === el));
    syncProductMain();
  },
  color: el => {
    view.color = el.dataset.v; view.added = false; hap.sel();
    $$('[data-act="color"]').forEach(b => b.classList.toggle("on", b === el));
    $("#cname").textContent = view.color;
    syncProductMain();
  },
  sizeGuide: () => {
    const g = CFG.sizeGuide;
    openSheet(`<h3 class="sh">Таблица размеров</h3>
      <table class="sg"><tr>${g.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>
      ${g.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>
      <p class="mu sm">${esc(g.note || "")}</p>`);
  },
  closeSheet: () => closeSheet(),
  plus: el => { const i = S.cart.find(x => keyOf(x) === el.dataset.k); if (i) i.qty = Math.min(i.qty + 1, 20); cartChanged(); },
  minus: el => {
    const i = S.cart.find(x => keyOf(x) === el.dataset.k);
    if (i) { i.qty--; if (i.qty <= 0) S.cart = S.cart.filter(x => x !== i); }
    cartChanged();
  },
  del: el => { S.cart = S.cart.filter(x => keyOf(x) !== el.dataset.k); cartChanged(); },
  promoOn: () => {
    const inp = $("#promo"), p = findPromo(inp.value);
    if (!p) { inp.classList.add("err"); shake(inp); hap.warn(); toast("Такого промокода нет"); return; }
    S.promo = p.code; store("promo", S.promo);
    hap.ok(); confetti(); render(false);
    toast(p.toast || "Промокод применён", 3600);
  },
  promoOff: () => { S.promo = ""; store("promo", ""); hap.tap(); render(false); },
  usePromo: () => {
    const p = (CFG.promos || [])[0]; if (!p) return;
    S.promo = p.code; store("promo", S.promo); closeSheet(); hap.ok();
    if (view.name === "cart") render(false);
    toast(p.toast || "Промокод применён", 3600);
  },
  delivery: el => { S.delivery = el.dataset.id; hap.sel(); syncCheckout(); },
  reload: () => location.reload()
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.f) { S.form[t.dataset.f] = t.value; t.classList.remove("err"); }
  else if (t.id === "q") { S.q = t.value; $("#grid").innerHTML = gridHtml(); }
  else if (t.id === "promo") t.classList.remove("err");
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "promo") A.promoOn();
});

// ---------- заставка и запуск ----------
function startSplash() {
  const sp = $("#splash");
  let seen = false;
  safe(() => { seen = !!sessionStorage.getItem("sp"); sessionStorage.setItem("sp", "1"); });
  if (seen || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) { sp.remove(); return; }
  $("#spw").innerHTML = Array.from(String(CFG.shopName || "")).map((ch, i) => `<span style="--i:${i}">${ch === " " ? "&nbsp;" : esc(ch)}</span>`).join("");
  $("#spt").textContent = CFG.tagline || "";
  const off = () => { sp.classList.add("hide"); setTimeout(() => sp.remove(), 700); };
  sp.addEventListener("click", off);
  setTimeout(off, 1700);
}

async function boot() {
  try {
    const r = await fetch("products.json?t=" + Date.now());
    const d = await r.json();
    CFG = d.settings || {};
    PRODUCTS = d.products || [];
    if (!PRODUCTS.length) throw new Error("empty");
  } catch (e) {
    $("#splash").remove();
    app.innerHTML = `<div class="empty">${I.bag}<b>Каталог недоступен</b><div>Проверьте соединение и попробуйте ещё раз</div><button class="cta" data-act="reload">Обновить</button></div>`;
    return;
  }
  if (!CFG.delivery || !CFG.delivery.length) CFG.delivery = [{ id: "pickup", name: "Самовывоз", note: "", price: 0, needAddress: false }];
  document.title = CFG.shopName || "Магазин";
  $("#brandName").textContent = CFG.shopName || "Магазин";
  $("#brandTag").textContent = CFG.tagline || "";
  // убрать из корзины то, чего больше нет в каталоге
  S.cart = S.cart.filter(i => {
    const p = prod(i.id);
    return p && p.sizes.includes(i.size) && (!(p.colors || []).length || p.colors.some(c => c.name === i.color));
  }).map(i => ({ id: i.id, size: i.size, color: i.color || "", qty: Math.min(Math.max(i.qty | 0, 1), 20) }));
  S.fav = S.fav.filter(id => prod(id));
  if (S.promo && !findPromo(S.promo)) S.promo = "";
  render();
  startSplash();
}
boot();
})();
</script>
</body>
</html>
